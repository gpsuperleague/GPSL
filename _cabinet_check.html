<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="history_trophy_cabinet.css?v=20261122-cabinet">
  <style>body{background:#111;margin:0;padding:28px;} .wrap{max-width:980px;margin:0 auto;background:#1a1a1a;padding:20px;}</style>
</head>
<body>
  <div class="wrap">
    <div class="trophy-cabinet has-wins">
      <div class="trophy-cabinet-cornice" aria-hidden="true">
        <span class="trophy-cabinet-nameplate">Honours</span>
      </div>
      <div class="trophy-cabinet-case">
        <span class="trophy-cabinet-hinge trophy-cabinet-hinge--left trophy-cabinet-hinge--high"></span>
        <span class="trophy-cabinet-hinge trophy-cabinet-hinge--left trophy-cabinet-hinge--low"></span>
        <span class="trophy-cabinet-hinge trophy-cabinet-hinge--right trophy-cabinet-hinge--high"></span>
        <span class="trophy-cabinet-hinge trophy-cabinet-hinge--right trophy-cabinet-hinge--low"></span>
        <span class="trophy-cabinet-handle trophy-cabinet-handle--left"></span>
        <span class="trophy-cabinet-handle trophy-cabinet-handle--right"></span>
        <div class="trophy-cabinet-glass">
          <section class="cabinet-shelf">
            <div class="shelf-plaque">League titles</div>
            <div class="shelf-board">
              <div class="shelf-bays">
                <div class="trophy-bay has-trophies">
                  <div class="trophy-bay-label">SuperLeague</div>
                  <div class="trophy-bay-surface">
                    <a class="trophy-on-shelf trophy-link" href="#"><img class="trophy-png" src="images/trophies/superleague.png" alt=""><figcaption class="trophy-season">Season 8</figcaption></a>
                    <a class="trophy-on-shelf trophy-link" href="#"><img class="trophy-png" src="images/trophies/superleague.png" alt=""><figcaption class="trophy-season">Season 5</figcaption></a>
                  </div>
                </div>
                <div class="trophy-bay has-trophies">
                  <div class="trophy-bay-label">Championship A</div>
                  <div class="trophy-bay-surface">
                    <a class="trophy-on-shelf trophy-link" href="#"><img class="trophy-png" src="images/trophies/championship.png" alt=""><figcaption class="trophy-season">Season 3</figcaption></a>
                  </div>
                </div>
                <div class="trophy-bay is-empty">
                  <div class="trophy-bay-label">Championship B</div>
                  <div class="trophy-bay-surface"><span class="trophy-bay-empty"></span></div>
                </div>
              </div>
            </div>
          </section>
          <section class="cabinet-shelf">
            <div class="shelf-plaque">Cup competitions</div>
            <div class="shelf-board">
              <div class="shelf-bays">
                <div class="trophy-bay has-trophies">
                  <div class="trophy-bay-label">League Cup</div>
                  <div class="trophy-bay-surface">
                    <a class="trophy-on-shelf trophy-link" href="#"><img class="trophy-png" src="images/trophies/league_cup.png" alt=""><figcaption class="trophy-season">Season 9</figcaption></a>
                  </div>
                </div>
                <div class="trophy-bay has-trophies">
                  <div class="trophy-bay-label">Plate</div>
                  <div class="trophy-bay-surface">
                    <a class="trophy-on-shelf trophy-link" href="#"><img class="trophy-png" src="images/trophies/plate.png" alt=""><figcaption class="trophy-season">Season 7</figcaption></a>
                  </div>
                </div>
                <div class="trophy-bay is-empty">
                  <div class="trophy-bay-label">Shield</div>
                  <div class="trophy-bay-surface"><span class="trophy-bay-empty"></span></div>
                </div>
              </div>
            </div>
          </section>
        </div>
      </div>
      <div class="trophy-cabinet-plinth" aria-hidden="true"></div>
    </div>
  </div>
</body>
</html>
