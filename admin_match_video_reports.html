<!DOCTYPE html>
<html lang="en" class="admin-root">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>html,body{background:#111;color:#ddd;margin:0}</style>
  <title>Match video reports — GPSL Admin</title>
  <link rel="stylesheet" href="dashboard.css">
  <link rel="stylesheet" href="nav_force_horizontal.css?v=20260728-nav-dropdown-fix">
  <link rel="stylesheet" href="admin.css">
  <style>
    .card .note { color:#999; font-size:13px; line-height:1.45; margin:0 0 12px; }
    .actions { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
    button.button.secondary { background:#444; color:#ddd; }
    .mvr-list { display:grid; gap:12px; }
    .mvr-card {
      border:1px solid #333; border-radius:6px; padding:12px 14px; background:#161616;
    }
    .mvr-card h3 { margin:0 0 6px; font-size:15px; color:#ffcc66; }
    .mvr-meta { font-size:12px; color:#999; margin-bottom:8px; line-height:1.4; }
    .mvr-note { font-size:13px; color:#ccc; margin:0 0 10px; white-space:pre-wrap; }
    .mvr-card label { display:grid; gap:4px; font-size:12px; color:#bbb; margin-bottom:8px; }
    .mvr-card select, .mvr-card input, .mvr-card textarea {
      padding:7px 9px; background:#1a1a1a; border:1px solid #333; color:#eee; border-radius:4px;
    }
    .mvr-card textarea { min-height:52px; resize:vertical; }
    .mvr-actions { display:flex; flex-wrap:wrap; gap:8px; }
    .status-pill {
      display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:600;
      text-transform:uppercase; letter-spacing:0.04em;
    }
    .status-open { background:#332200; color:#fc6; }
    .status-upheld { background:#1a331a; color:#8d8; }
    .status-dismissed { background:#333; color:#aaa; }
    #reportsStatus { margin-top:10px; font-size:13px; white-space:pre-wrap; }
  </style>
</head>
<body class="admin-page">
  <div id="nav"></div>
  <h1 class="admin-title">Match video reports</h1>
  <div class="card">
    <p class="note">
      Owners flag breaches visible in uploaded match videos (circled <b>R</b> on fixtures).
      Uphold applies a fine from the tariff dropdown and credits the reporter
      <b>₿2,000</b> to GPSL Building Society. Missing-upload points are automatic and separate.
    </p>
    <div class="actions">
      <button type="button" class="button" id="filterOpenBtn">Open</button>
      <button type="button" class="button secondary" id="filterAllBtn">All</button>
      <a class="button secondary" href="admin_match_videos.html">Match videos</a>
      <a class="button secondary" href="admin_fines.html">Apply fines</a>
    </div>
    <div id="reportsList" class="mvr-list"></div>
    <div id="reportsStatus"></div>
  </div>
  <script type="module" src="admin_match_video_reports.js?v=20260914-reports-pts"></script>
</body>
</html>
