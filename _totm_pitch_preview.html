<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TOTM pitch preview</title>
  <link rel="stylesheet" href="matchday_squad.css">
  <link rel="stylesheet" href="pitch_display.css">
  <style>
    body { background:#111; color:#ddd; font-family:Arial,sans-serif; margin:16px; }
    pre { white-space:pre-wrap; color:#9e9; }
  </style>
</head>
<body>
  <div id="out"></div>
  <pre id="report">measuring…</pre>
  <script type="module">
    import { renderFormationPitchHtml } from "./pitch_display.js";
    import { MATCHDAY_FORMATIONS } from "./matchday_formations.js";

    const names = [
      "Alexander Scott",
      "João Félix",
      "Mohamed Salah",
      "Kevin De Bruyne",
      "Bukayo Saka",
      "Vinícius Júnior",
      "Erling Haaland",
      "Luka Modrić",
      "Rodri Hernández",
      "Phil Foden",
    ];
    const ids = ["4-4-2", "5-3-2", "4-2-1-3", "4-1-4-1", "3-2-4-1", "4-3-3"];

    function members(formation) {
      return formation.slots.map((s, i) => ({
        pitch_slot: s.id,
        player_id: String(1000 + i),
        player_name: names[i % names.length],
        club_short_name: "BAR",
        club_name: "Barcelona",
        appearances: 6,
        goals: 4,
        assists: 2,
        avg_rating: 8.21,
        slot_label: s.label,
      }));
    }

    document.getElementById("out").innerHTML = ids
      .map((id) =>
        renderFormationPitchHtml({
          formationId: id,
          members: members(MATCHDAY_FORMATIONS[id]),
          title: id,
        })
      )
      .join("");

    const overlap = (a, b) => {
      const ox = Math.min(a.right, b.right) - Math.max(a.left, b.left);
      const oy = Math.min(a.bottom, b.bottom) - Math.max(a.top, b.top);
      return ox > 1 && oy > 1 ? { ox, oy } : null;
    };

    requestAnimationFrame(() => {
      const lines = [];
      document.querySelectorAll(".pitch-display").forEach((display, di) => {
        const cards = [...display.querySelectorAll(".pitch-slot--readonly")];
        const rects = cards.map((el) => el.getBoundingClientRect());
        let overlaps = 0;
        for (let i = 0; i < rects.length; i++) {
          for (let j = i + 1; j < rects.length; j++) {
            const hit = overlap(rects[i], rects[j]);
            if (hit) {
              overlaps++;
              lines.push(
                `${ids[di]} overlap ${cards[i].dataset.slotId} & ${cards[j].dataset.slotId} ${hit.ox.toFixed(0)}x${hit.oy.toFixed(0)}`
              );
            }
          }
          const img = cards[i].querySelector("img");
          const name = cards[i].querySelector(".pitch-player-name");
          const club = cards[i].querySelector(".pitch-player-club");
          const stats = cards[i].querySelector(".pitch-stat-grid");
          if (img && name) {
            const hit = overlap(img.getBoundingClientRect(), name.getBoundingClientRect());
            if (hit) lines.push(`${ids[di]} image/name ${cards[i].dataset.slotId}`);
          }
          if (name && club) {
            const hit = overlap(name.getBoundingClientRect(), club.getBoundingClientRect());
            if (hit) lines.push(`${ids[di]} name/club ${cards[i].dataset.slotId}`);
          }
          if (club && stats) {
            const hit = overlap(club.getBoundingClientRect(), stats.getBoundingClientRect());
            if (hit) lines.push(`${ids[di]} club/stats ${cards[i].dataset.slotId}`);
          }
          if (img) {
            const ir = img.getBoundingClientRect();
            if (Math.abs(ir.width - 48) > 1 || Math.abs(ir.height - 64) > 1) {
              lines.push(`${ids[di]} img size ${ir.width.toFixed(0)}x${ir.height.toFixed(0)}`);
            }
          }
        }
        const pitch = display.querySelector(".football-pitch");
        const pr = pitch.getBoundingClientRect();
        let clipped = 0;
        rects.forEach((r, i) => {
          if (r.left < pr.left - 1 || r.right > pr.right + 1 || r.bottom > pr.bottom + 1) {
            clipped++;
            lines.push(`${ids[di]} clipped ${cards[i].dataset.slotId}`);
          }
        });
        lines.push(
          `${ids[di]} cards=${cards.length} overlaps=${overlaps} clipped=${clipped} pitch=${pr.width.toFixed(0)}x${pr.height.toFixed(0)}`
        );
      });
      document.getElementById("report").textContent = lines.join("\n");
    });
  </script>
</body>
</html>
