<script>
  window.CURRENT_PAGE = "club_database";
</script>
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Club Database — GPSL</title>
  <link rel="stylesheet" href="dashboard.css">
  <link rel="stylesheet" href="nav_force_horizontal.css?v=20260728-nav-dropdown-fix">
  <style>
    body {
      background: #111;
      color: #ddd;
      font-family: Arial, sans-serif;
      padding: 20px;
      margin: 0;
    }
    #pageTitle {
      background: #222;
      color: #ff9900;
      padding: 10px 16px;
      border-radius: 6px;
      display: inline-block;
      margin-bottom: 12px;
      font-size: 24px;
      font-weight: bold;
    }
    .filter-group {
      background: #1a1a1a;
      color: #ff9900;
      padding: 10px 14px;
      border-radius: 6px;
      margin-bottom: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: flex-end;
      border: 1px solid #333;
    }
    .filter-group label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 12px;
      color: #ffaa22;
    }
    input, select {
      background: #222;
      color: #ddd;
      border: 1px solid #444;
      padding: 4px 6px;
      border-radius: 4px;
    }
    #statusNote { color: #aaa; font-size: 12px; margin-bottom: 10px; }
    #cdbError { color: #f88; margin-bottom: 10px; }
    .table-wrap { overflow-x: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #1a1a1a;
      color: #ddd;
      border-radius: 6px;
      overflow: hidden;
      margin-top: 8px;
      min-width: 1100px;
    }
    th {
      background: #222;
      color: #ff9900;
      padding: 8px;
      font-size: 12px;
      border-bottom: 2px solid #444;
      border-right: 1px solid #333;
      position: sticky;
      top: 0;
      z-index: 2;
      cursor: pointer;
      text-align: center;
      white-space: nowrap;
    }
    th.sort-asc::after { content: " ▲"; font-size: 10px; }
    th.sort-desc::after { content: " ▼"; font-size: 10px; }
    td {
      padding: 6px 8px;
      border-bottom: 1px solid #333;
      border-right: 1px solid #333;
      font-size: 12px;
      text-align: center;
    }
    td.left { text-align: left; }
    tbody tr:nth-child(odd) { background: #1f1f1f; }
    tbody tr:nth-child(even) { background: #262626; }
    tbody tr:hover { background: #333 !important; }
    .money { white-space: nowrap; }
    a.club-link { color: #6cf; text-decoration: none; font-weight: bold; }
    a.club-link:hover { text-decoration: underline; }
    .pager { margin-top: 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    a.button, button.button {
      display: inline-block;
      padding: 6px 12px;
      background: #1a1a1a;
      color: #ff9900;
      border: 1px solid #666;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
      cursor: pointer;
    }
    button.button:disabled { opacity: 0.45; cursor: not-allowed; }
    #interestBanner {
      display: none;
      background: #1a1810;
      border: 1px solid #4a3a10;
      color: #ddd;
      padding: 10px 14px;
      border-radius: 6px;
      margin-bottom: 12px;
      font-size: 13px;
      line-height: 1.45;
    }
    #interestBanner a { color: #e8c84a; }
    #interestBanner .frozen { color: #f0a; }
    .interest-cell { min-width: 140px; max-width: 220px; font-size: 11px; color: #bbb; line-height: 1.35; text-align: left; }
    .interest-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
    .interest-tag {
      display: inline-block; padding: 1px 6px; border: 1px solid #555; border-radius: 3px;
      background: #1a1a1a; color: #ccc; font-size: 10px;
    }
    .interest-tag.is-me { color: #9f9; border-color: #3a5a3a; }
    .interest-note-hint { display: block; font-size: 10px; color: #777; margin-top: 2px; max-width: 200px; }
    .interest-btn {
      padding: 4px 10px; border: none; cursor: pointer; font-size: 11px; font-weight: bold;
      margin-top: 2px; background: #ff9900; color: #111; border-radius: 4px;
    }
    .interest-btn:disabled { background: #555 !important; color: #888 !important; cursor: not-allowed; }
    .interest-btn.is-marked { background: #2f5f2f; color: #dfd; }
    .vacant-badge {
      display: inline-block; margin-left: 6px; padding: 1px 6px; font-size: 10px;
      border: 1px solid #556; border-radius: 3px; color: #9cf; vertical-align: middle;
    }
    #cdbInterestModal {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7);
      z-index: 1000; align-items: center; justify-content: center; padding: 16px;
    }
    #cdbInterestModal.open { display: flex; }
    .cdb-interest-modal-inner {
      width: 100%; max-width: 440px; padding: 18px 20px 20px; position: relative;
      background: #14120e; border: 1px solid #333; border-radius: 8px;
    }
    .cdb-interest-modal-close {
      position: absolute; top: 10px; right: 14px; font-size: 24px; color: #aaa; cursor: pointer; line-height: 1;
    }
    .cdb-interest-modal-close:hover { color: #fff; }
    .cdb-interest-modal-inner h2 { margin: 0 0 8px; font-size: 18px; color: #e8c84a; }
    .cdb-interest-modal-inner textarea {
      width: 100%; min-height: 72px; box-sizing: border-box; background: #1a1a1a; color: #ddd;
      border: 1px solid #444; border-radius: 4px; padding: 8px; margin-top: 6px; resize: vertical;
    }
    .cdb-interest-modal-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    #cdbInterestModalError { color: #f88; font-size: 12px; margin-top: 8px; min-height: 1em; }
  </style>
</head>
<body>
  <div id="pageTitle">Club Database</div>
  <div id="nav"></div>

  <p id="statusNote">Loading clubs…</p>
  <div id="cdbError"></div>
  <div id="interestBanner"></div>

  <div class="filter-group">
    <label>Search
      <input id="filterSearch" type="search" placeholder="Club, stadium, nation, owner…" autocomplete="off">
    </label>
    <label>Nation
      <select id="filterNation"><option value="">All</option></select>
    </label>
    <label>Owner
      <select id="filterOwner">
        <option value="">All</option>
        <option value="vacant">Vacant only</option>
        <option value="owned">Owned only</option>
      </select>
    </label>
    <label>Page size
      <select id="pageSize">
        <option value="50">50</option>
        <option value="100" selected>100</option>
        <option value="200">200</option>
      </select>
    </label>
    <button type="button" class="button gpsl-view-ok" id="clearFiltersBtn">Clear filters</button>
  </div>

  <div class="table-wrap">
    <table>
      <thead id="tableHead"></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
  <div class="pager" id="pager"></div>

  <div id="cdbInterestModal" aria-hidden="true">
    <div class="cdb-interest-modal-inner">
      <span class="cdb-interest-modal-close" id="cdbInterestModalClose">&times;</span>
      <h2 id="cdbInterestModalTitle">Mark interest</h2>
      <p style="margin:0 0 8px;font-size:12px;color:#999;line-height:1.4;">
        Waiting-list / invited owners can mark up to 3 vacant clubs before bidding opens so others can see interest and negotiate.
        Optional note for other owners (e.g. happy to talk).
      </p>
      <label for="cdbInterestNote" style="font-size:12px;color:#aaa;">Note (optional)</label>
      <textarea id="cdbInterestNote" maxlength="280" placeholder="e.g. Open to swapping — DM me on Discord"></textarea>
      <div class="cdb-interest-modal-actions">
        <button type="button" class="button" id="cdbInterestSaveBtn" style="background:#ff9900;color:#111;">Save interest</button>
        <button type="button" class="button" id="cdbInterestClearBtn" style="background:#442222;color:#fcc;">Remove</button>
      </div>
      <p id="cdbInterestModalError"></p>
    </div>
  </div>

  <script type="module" src="club_database.js?v=20260921-interest"></script>
</body>
</html>
