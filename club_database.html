<script>
  window.CURRENT_PAGE = "club_database";
</script>
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Club Database — GPSL</title>
  <link rel="stylesheet" href="dashboard.css">
  <link rel="stylesheet" href="nav_force_horizontal.css?v=20260728-nav-dropdown-fix">
  <style>
    body {
      background: #111;
      color: #ddd;
      font-family: Arial, sans-serif;
      padding: 20px;
      margin: 0;
    }
    #pageTitle {
      background: #222;
      color: #ff9900;
      padding: 10px 16px;
      border-radius: 6px;
      display: inline-block;
      margin-bottom: 12px;
      font-size: 24px;
      font-weight: bold;
    }
    .filter-group {
      background: #1a1a1a;
      color: #ff9900;
      padding: 10px 14px;
      border-radius: 6px;
      margin-bottom: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: flex-end;
      border: 1px solid #333;
    }
    .filter-group label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 12px;
      color: #ffaa22;
    }
    input, select {
      background: #222;
      color: #ddd;
      border: 1px solid #444;
      padding: 4px 6px;
      border-radius: 4px;
    }
    #statusNote { color: #aaa; font-size: 12px; margin-bottom: 10px; }
    #cdbError { color: #f88; margin-bottom: 10px; }
    .table-wrap { overflow-x: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #1a1a1a;
      color: #ddd;
      border-radius: 6px;
      overflow: hidden;
      margin-top: 8px;
      min-width: 1100px;
    }
    th {
      background: #222;
      color: #ff9900;
      padding: 8px;
      font-size: 12px;
      border-bottom: 2px solid #444;
      border-right: 1px solid #333;
      position: sticky;
      top: 0;
      z-index: 2;
      cursor: pointer;
      text-align: center;
      white-space: nowrap;
    }
    th.sort-asc::after { content: " ▲"; font-size: 10px; }
    th.sort-desc::after { content: " ▼"; font-size: 10px; }
    td {
      padding: 6px 8px;
      border-bottom: 1px solid #333;
      border-right: 1px solid #333;
      font-size: 12px;
      text-align: center;
    }
    td.left { text-align: left; }
    tbody tr:nth-child(odd) { background: #1f1f1f; }
    tbody tr:nth-child(even) { background: #262626; }
    tbody tr:hover { background: #333 !important; }
    .money { white-space: nowrap; }
    a.club-link { color: #6cf; text-decoration: none; font-weight: bold; }
    a.club-link:hover { text-decoration: underline; }
    .pager { margin-top: 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    a.button, button.button {
      display: inline-block;
      padding: 6px 12px;
      background: #1a1a1a;
      color: #ff9900;
      border: 1px solid #666;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="pageTitle">Club Database</div>
  <div id="nav"></div>

  <p id="statusNote">Loading clubs…</p>
  <div id="cdbError"></div>

  <div class="filter-group">
    <label>Search
      <input id="filterSearch" type="search" placeholder="Club, stadium, nation, owner…" autocomplete="off">
    </label>
    <label>Nation
      <select id="filterNation"><option value="">All</option></select>
    </label>
    <label>Page size
      <select id="pageSize">
        <option value="50">50</option>
        <option value="100" selected>100</option>
        <option value="200">200</option>
      </select>
    </label>
    <button type="button" class="button gpsl-view-ok" id="clearFiltersBtn">Clear filters</button>
  </div>

  <div class="table-wrap">
    <table>
      <thead id="tableHead"></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
  <div class="pager" id="pager"></div>

  <script type="module" src="club_database.js?v=20260807-cdb2"></script>
</body>
</html>
