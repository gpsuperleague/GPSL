<!DOCTYPE html>
<html lang="en">
<head>
  <script>window.CURRENT_PAGE = "fixtures";</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Schedule match — GPSL</title>
  <link rel="stylesheet" href="dashboard.css">
  <link rel="stylesheet" href="nav_force_horizontal.css?v=20260728-nav-dropdown-fix">
  <link rel="stylesheet" href="matchday_console_rules.css?v=20261012-console-text2">
  <style>
    body { background:#111; color:#ddd; font-family:Arial,sans-serif; margin:0; }
    .page-container { width:95%; max-width:900px; margin:20px auto 40px; }
    h1 { color:#ff9900; margin-bottom:8px; font-size:22px; }
    .meta { color:#aaa; font-size:13px; line-height:1.45; margin-bottom:14px; }
    .panel { background:#1a1a1a; border:1px solid #333; border-radius:8px; padding:16px 18px; margin-bottom:16px; }
    .panel h2 { color:#ff9900; font-size:16px; margin:0 0 10px; }
    .fixture-head { font-size:18px; font-weight:bold; margin-bottom:6px; }
    .status-agreed { color:#8c8; }
    .status-pending { color:#fc6; }
    .discord-hint {
      background:#2a2200; border:1px solid #664400; border-radius:6px;
      padding:12px 14px; color:#ecc; font-size:13px; line-height:1.45; margin-bottom:16px;
    }
    .slot-list { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
    .slot-btn {
      display:flex; flex-direction:column; gap:2px;
      padding:8px 12px; background:#222; border:1px solid #444; color:#ddd;
      border-radius:6px; cursor:pointer; font-size:12px; text-align:left;
      min-width:9.5rem;
    }
    .slot-btn .slot-main { font-weight:600; color:#eee; line-height:1.25; }
    .slot-btn .slot-sub { font-size:10px; color:#888; line-height:1.25; font-weight:normal; }
    .slot-btn:hover { border-color:#ff9900; }
    .slot-btn:hover .slot-main { color:#ff9900; }
    .slot-btn.selected { background:#3d3200; border-color:#ff9900; }
    .slot-btn.selected .slot-main { color:#ffcc66; }
    .kickoff-line { line-height:1.35; }
    .actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:14px; align-items:center; }
    .button {
      padding:8px 14px; background:#ff9900; color:#111; border:none;
      border-radius:6px; font-weight:bold; cursor:pointer; font-size:13px;
    }
    .button.secondary { background:#444; color:#eee; }
    .button:disabled { opacity:.5; cursor:not-allowed; }
    .mutual-panel { border-color:#446; background:#151820; }
    .mutual-panel h2 { font-size:15px; color:#9cf; }
    .catch-up-banner {
      background:#2a2200; border:1px solid #996600; border-radius:8px;
      padding:12px 14px; color:#ecc; font-size:13px; line-height:1.45; margin-bottom:16px;
    }
    .fixture-unavailable {
      margin:12px 0 4px;
      padding:10px 0 0;
      border-top:1px solid #333;
    }
    .fixture-unavailable-title {
      color:#ffcc66; font-weight:600; font-size:13px; margin-bottom:8px;
    }
    .fixture-unavailable-grid {
      display:grid; grid-template-columns:1fr 1fr; gap:12px;
    }
    @media (max-width:700px) {
      .fixture-unavailable-grid { grid-template-columns:1fr; }
    }
    .fixture-unavailable-club { color:#aaa; font-size:12px; margin-bottom:4px; font-weight:600; }
    .unavailable-list { list-style:none; margin:0; padding:0; font-size:12px; }
    .unavailable-list li { margin:3px 0; }
    .unavailable-none, .unavailable-empty { color:#777; font-style:italic; }
    .unavailable-tag {
      display:inline-block; font-size:10px; font-weight:700;
      border-radius:3px; padding:1px 5px; margin-right:4px; vertical-align:middle;
    }
    .unavailable-suspended .unavailable-tag {
      background:#5a2018; color:#ffd0a8; border:1px solid #a04830;
    }
    .unavailable-injured .unavailable-tag {
      background:#1a3a4a; color:#9ed4f0; border:1px solid #3a6a8a;
    }
    .unavailable-recovery .unavailable-tag {
      background:#2a3a1a; color:#c8e89a; border:1px solid #5a7a3a;
    }
    .unavailable-pos { color:#777; }
    .unavailable-detail { color:#999; }
    .deadline-box {
      background:#2a2200; border:1px solid #996600; border-radius:6px;
      padding:10px 12px; color:#ffdf99; font-size:13px; line-height:1.45; margin:10px 0;
    }
    .deadline-box.deadline-late { background:#2a1212; border-color:#a04040; color:#ffb8b8; }
    .deadline-box.deadline-info { background:#101c28; border-color:#2a4a6a; color:#cfe3ff; }
    .deadline-box a { color:#ff9900; }
    .tz-compare {
      margin:10px 0 12px; padding:10px 12px;
      background:#121820; border:1px solid #2a3a4a; border-radius:6px;
    }
    .tz-compare-title {
      color:#9cf; font-size:12px; font-weight:700; letter-spacing:0.02em;
      text-transform:uppercase; margin-bottom:8px;
    }
    .tz-compare-grid {
      display:grid; grid-template-columns:1fr 1fr; gap:10px;
    }
    @media (max-width:700px) {
      .tz-compare-grid { grid-template-columns:1fr; }
    }
    .tz-compare-card {
      background:#0e141c; border:1px solid #243040; border-radius:5px; padding:8px 10px;
    }
    .tz-compare-club { color:#aaa; font-size:11px; font-weight:600; margin-bottom:2px; }
    .tz-compare-zone { color:#e8f0ff; font-size:13px; font-weight:700; }
    .tz-compare-now { color:#8ab; font-size:12px; margin-top:3px; }
    .tz-compare-note { color:#8899aa; font-size:12px; line-height:1.4; margin:8px 0 0; }
    .tz-compare-note b { color:#cde; }
    .schedule-manual-note {
      background:#101c28; border:1px solid #2a4a6a; border-radius:6px;
      padding:10px 12px; color:#cfe3ff; font-size:13px; line-height:1.45; margin:0 0 14px;
    }
    .schedule-manual-note a { color:#ff9900; }
    .schedule-tabs {
      display:flex; flex-wrap:wrap; gap:0; margin:0 0 14px;
      border-bottom:1px solid #333;
    }
    .schedule-tab {
      appearance:none; background:transparent; border:none;
      border-bottom:2px solid transparent; margin-bottom:-1px;
      padding:10px 14px; color:#aaa; font-size:13px; font-weight:700;
      cursor:pointer; font-family:inherit;
    }
    .schedule-tab:hover { color:#eee; }
    .schedule-tab.active {
      color:#ff9900; border-bottom-color:#ff9900;
    }
    .schedule-tab-pane h2 { color:#ff9900; font-size:16px; margin:0 0 10px; }
    .schedule-tab-pane.discord-pane h2 { color:#9cf; }
    .schedule-tab-pane.discord-pane {
      background:#151820; border:1px solid #446; border-radius:8px;
      padding:14px 16px;
    }
  </style>
</head>
<body>
  <div id="nav"></div>
  <div class="page-container">
    <p><a href="fixtures.html" style="color:#ff9900;">← Fixtures</a></p>
    <h1>Schedule match</h1>
    <p id="scheduleMeta" class="meta">Loading…</p>
    <div id="discordHint" class="discord-hint" hidden>
      Agreed a time on <b>Discord</b><span id="discordOpponentTag"></span>? Open the <b>Agreed on Discord scheduling</b> tab below so both clubs confirm on the site. Reply and arrangement deadlines keep running until it is locked. Use <b>GPSL Match Scheduling</b> to propose or counter as usual.
    </div>
    <div id="scheduleRoot"></div>
    <p id="scheduleStatus" class="meta" role="status"></p>
  </div>
  <script type="module" src="fixture_schedule.js?v=20261022-schedule-tabs"></script>
</body>
</html>
