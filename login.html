<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GPSL Login</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #eee;
      text-align: center;
      padding-top: 80px;
    }

    input {
      padding: 10px;
      width: 240px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #222;
      color: #eee;
      box-sizing: border-box;
    }

    button {
      padding: 10px 20px;
      background: #ff9900;
      color: #111;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 10px;
    }

    button:hover {
      background: #ffaa22;
      transform: scale(1.05);
    }

    button.secondary {
      background: #333;
      color: #ddd;
      border: 1px solid #555;
    }

    button.secondary:hover {
      background: #444;
    }

    a {
      color: #ff9900;
      cursor: pointer;
    }

    #authStatus {
      margin: 14px auto 0;
      max-width: 360px;
      min-height: 1.2em;
      font-size: 14px;
      color: #ccc;
      line-height: 1.4;
    }
    #authStatus.is-error { color: #f88; }
    #authStatus.is-ok { color: #9d9; }
  </style>
</head>

<body>

  <h1>Login</h1>

  <form id="loginForm" autocomplete="on">
    <input id="email" name="email" type="email" placeholder="Email" autocomplete="username" required><br><br>
    <input id="password" name="password" type="password" placeholder="Password" autocomplete="current-password"><br><br>
    <button type="submit" id="loginBtn">Login</button>
  </form>
  <br>
  <button type="button" id="resetBtn" class="secondary">Forgot your password?</button>
  <div id="authStatus" role="status" aria-live="polite"></div>
  <p style="margin-top:28px;font-size:14px;color:#999;">
    New to GPSL? Join via the invite link in Discord<br>
    (<a href="join_gpsl.html">Discord join page</a> — server members only).
  </p>

  <script type="module">
    import { supabase, waitForAuthSession } from "./supabase_client.js";

    const statusEl = document.getElementById("authStatus");

    function setAuthStatus(msg, ok = null) {
      if (!statusEl) return;
      statusEl.textContent = msg || "";
      statusEl.classList.remove("is-error", "is-ok");
      if (ok === true) statusEl.classList.add("is-ok");
      if (ok === false) statusEl.classList.add("is-error");
    }

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!email || !password) {
        setAuthStatus("Enter email and password to log in.", false);
        return;
      }

      setAuthStatus("Signing in…");
      const { error } = await supabase.auth.signInWithPassword({
        email,
        password,
      });

      if (error) {
        setAuthStatus(error.message || "Invalid login credentials", false);
        return;
      }

      const session = await waitForAuthSession();
      if (!session?.user) {
        setAuthStatus(
          "Login succeeded but the session could not be saved. On iPhone: Settings → Safari → turn off “Prevent Cross-Site Tracking” for this site, or allow cookies, then try again.",
          false
        );
        return;
      }

      const { error: loginLogErr } = await supabase.rpc("record_owner_site_login");
      if (loginLogErr) {
        console.warn("record_owner_site_login:", loginLogErr.message);
      } else {
        try {
          localStorage.setItem("gpsl_site_login_at", String(Date.now()));
        } catch {
          /* ignore */
        }
      }

      let dest = "dashboard.html";
      try {
        const { data: self } = await supabase.rpc("owner_registry_get_self");
        if (self?.is_archived) {
          dest = "member_home.html?archived=1";
        } else if (self && !self.has_club && self.needs_club_auction) {
          dest = "awaiting_club.html";
        } else if (self && !self.has_club && self.is_member) {
          dest = "waiting_list.html";
        } else if (
          self &&
          !self.has_club &&
          !self.is_member &&
          self.status == null
        ) {
          dest = "member_home.html";
        }
      } catch (_) {
        /* RPC missing — fall back to dashboard */
      }

      window.location.assign(dest);
    });

    document.getElementById("resetBtn").addEventListener("click", async () => {
      const email = document.getElementById("email").value.trim();

      if (!email) {
        setAuthStatus("Enter your email above, then click Forgot your password.", false);
        document.getElementById("email")?.focus();
        return;
      }

      setAuthStatus("Sending password reset email…");
      const { error } = await supabase.auth.resetPasswordForEmail(email, {
        redirectTo: "https://gpsuperleague.github.io/GPSL/reset_password.html",
      });

      if (error) {
        setAuthStatus(
          (error.message || "Could not send reset email") +
            " — ask admin to send a reset from Owners → Reset password, or check the email address.",
          false
        );
        return;
      }

      setAuthStatus(
        "If that email has a GPSL login, a reset link is on its way. Check inbox/spam, then open the link to set a new password.",
        true
      );
    });
  </script>

</body>
</html>
