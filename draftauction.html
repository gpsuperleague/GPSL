<script>
  window.CURRENT_PAGE = "draftauction";
</script>

<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Draft Auction</title>
  <link rel="stylesheet" href="dashboard.css">
  <link rel="stylesheet" href="nav_force_horizontal.css?v=20260728-nav-dropdown-fix">
  <link rel="stylesheet" href="gpsl_rules_cards.css?v=20260812-draft-detail">
  <link rel="stylesheet" href="gpsl_info_tips.css?v=20260811-tips-refresh">

  <style>
    body {
      background:#111;
      color:#ddd;
      font-family:Arial,sans-serif;
      margin:0;
    }

    #nav {
      padding:15px;
      background:#1a1a1a;
      border-bottom:1px solid #333;
      text-align:center;
    }

    a.button, button.button {
      display:inline-block;
      padding:10px 20px;
      background:#ff9900;
      color:#111;
      text-decoration:none;
      font-weight:bold;
      border-radius:6px;
      margin:5px;
      transition:0.2s;
      cursor:pointer;
      border:none;
    }

    a.button:hover, button.button:hover {
      background:#ffaa22;
      transform:scale(1.05);
    }

    h1 {
      margin:20px;
      color:#ff9900;
    }

    .status-note {
      font-size:13px;
      color:#ccc;
      margin:0 20px 10px 20px;
    }

    .panel {
      background:#1a1a1a;
      margin:20px;
      padding:20px;
      border-radius:8px;
      border:1px solid #333;
      overflow-x:auto;
    }

    table.gpsl-table {
      width:100%;
      border-collapse:collapse;
      table-layout:auto;
    }

    table.gpsl-table th,
    table.gpsl-table td {
      border:1px solid #333;
      padding:8px;
      font-size:13px;
      text-align:center;
      vertical-align:middle;
    }

    table.gpsl-table .col-fav,
    table.gpsl-table .col-thumb,
    table.gpsl-table .col-compact {
      width:1%;
      white-space:nowrap;
    }

    table.gpsl-table .col-money {
      white-space:nowrap;
    }

    table.gpsl-table .col-player {
      max-width:14rem;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    table.gpsl-table .col-leading-club {
      width:auto;
      min-width:max(9rem, max-content);
      white-space:nowrap;
      overflow:visible;
      text-overflow:clip;
      text-align:left;
      padding-left:12px;
      padding-right:12px;
    }

    table.gpsl-table th.col-leading-club {
      text-align:center;
    }

    table.gpsl-table .col-owner {
      white-space:nowrap;
    }

    table.gpsl-table th {
      background:#222;
      color:#ff9900;
    }

    .player-link {
      color:#fff;
      text-decoration:none;
    }

    .player-link:hover {
      text-decoration:underline;
      color:#ffcc66;
    }

    .bid-btn {
      padding:4px 8px;
      font-size:11px;
      border-radius:4px;
      border:none;
      cursor:pointer;
    }

    .bid-btn.enabled {
      background:#2f7a2f;
      color:#fff;
    }

    .bid-btn.enabled:hover {
      background:#369a36;
    }

    .bid-btn.disabled {
      background:#444;
      color:#999;
      cursor:not-allowed;
    }

    .fav-btn {
      background:transparent;
      border:none;
      color:#666;
      font-size:20px;
      cursor:pointer;
      padding:0 4px;
      line-height:1;
    }

    .fav-btn.fav-on {
      color:#ff9900;
    }

    .fav-btn:hover {
      color:#ffcc66;
    }

    tr.draft-fav-row td {
      background:#1f1a12;
    }

    .draft-thumb {
      height:50px;
      width:auto;
      object-fit:contain;
      background:#000;
      border-radius:3px;
      border:1px solid #333;
      padding:1px;
      display:block;
      margin:0 auto;
    }

    .draft-header-row {
      display:flex;
      align-items:center;
      justify-content:space-between;
      flex-wrap:wrap;
      gap:12px;
      margin:0 20px 15px 20px;
    }
    .club-bank-status-left {
      display:flex;
      align-items:center;
      flex-wrap:wrap;
      gap:10px 14px;
      min-width:0;
    }

    .draft-timer {
      background:#1a1a1a;
      border:1px solid #666;
      padding:8px 12px;
      border-radius:8px;
      display:flex;
      flex-direction:column;
      align-items:flex-start;
      min-width:200px;
    }

    #draftCountdown {
      color:#ff9900;
      font-weight:bold;
      font-family:monospace;
      font-size:16px;
    }

    #draftLocalStart {
      font-size:12px;
      color:#ccc;
      margin-top:4px;
      white-space:pre-line;
      line-height:1.4;
    }

    .bid-btn.view-only {
      background:#444;
      color:#ddd;
      cursor:pointer;
    }
    .bid-btn.view-only:hover { background:#555; }

    .draft-row-actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .draft-hide-btn {
      background: transparent;
      color: #999;
      border: 1px solid #555;
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 10px;
      cursor: pointer;
      line-height: 1.3;
    }
    .draft-hide-btn:hover {
      color: #ffcc66;
      border-color: #886600;
    }
    .draft-hide-btn.is-hidden-row {
      color: #8d8;
      border-color: #3a5a3a;
    }
    tr.draft-row-hidden td {
      opacity: 0.55;
    }

    button.button.button-secondary {
      background:#333;
      color:#ddd;
      border:1px solid #555;
      padding:8px 14px;
      font-size:12px;
    }

    button.button.button-secondary:hover {
      background:#444;
      transform:none;
    }

    button.button.button-secondary:disabled {
      opacity:0.65;
      cursor:wait;
      transform:none;
    }

    .draft-refresh-note {
      font-size:11px;
      color:#888;
      margin:0 20px 10px 20px;
    }

    .draft-filters {
      display:flex;
      flex-wrap:wrap;
      align-items:flex-end;
      gap:12px 16px;
      margin:0 20px 12px 20px;
      padding:12px 14px;
      background:#1a1a1a;
      border:1px solid #333;
      border-radius:8px;
    }

    .draft-filters label {
      display:flex;
      flex-direction:column;
      gap:4px;
      font-size:12px;
      color:#bbb;
    }

    .draft-filters input[type="text"],
    .draft-filters select,
    .draft-filters input[type="number"] {
      padding:7px 10px;
      background:#111;
      border:1px solid #444;
      color:#ddd;
      border-radius:4px;
      font-size:13px;
      min-width:160px;
    }

    .draft-filters input[type="number"]#draftRefreshInterval {
      min-width:88px;
      max-width:100px;
    }

    .draft-filters input[type="text"] {
      min-width:200px;
    }

    .draft-filters select {
      min-width:220px;
      max-width:280px;
    }

    .draft-filters .filter-check {
      flex-direction:row;
      align-items:center;
      gap:8px;
      padding-bottom:6px;
      cursor:pointer;
      user-select:none;
    }

    .draft-filters .filter-check input {
      width:16px;
      height:16px;
      cursor:pointer;
    }

    .draft-filters .filter-action {
      display:flex;
      flex-direction:column;
      gap:4px;
    }

    .draft-filters .filter-action-label {
      font-size:12px;
      color:#bbb;
    }

    .draft-filters .filter-action-btns {
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      align-items:center;
    }

    .draft-filters .filter-hint {
      font-size:11px;
      color:#888;
      margin-top:2px;
    }

    #draftScoutedFilterBtn.is-active,
    #draftMyClubFilterBtn.is-active {
      background: #3d3200;
      border-color: #ff9900;
      color: #ffcc66;
    }

    .draft-filter-summary {
      font-size:12px;
      color:#888;
      margin:0 20px 10px 20px;
    }

    .draft-filters-advanced {
      display:flex;
      flex-wrap:wrap;
      gap:12px 16px;
      align-items:flex-end;
      margin:0 20px 12px;
      padding:12px 14px;
      background:#1a1a1a;
      border:1px solid #333;
      border-radius:8px;
    }

    .draft-filters-advanced .multi-filter {
      position:relative;
      min-width:160px;
    }
    .draft-filters-advanced .multi-filter-label {
      font-size:12px;
      color:#ffaa22;
      margin-bottom:2px;
    }
    .draft-filters-advanced .multi-filter-control {
      background:#222;
      color:#ddd;
      border:1px solid #444;
      padding:6px 8px;
      border-radius:4px;
      font-size:12px;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:space-between;
      min-height:28px;
    }
    .draft-filters-advanced .multi-filter-control::after {
      content:"▾";
      font-size:10px;
      color:#888;
      margin-left:6px;
    }
    .draft-filters-advanced .multi-filter-panel {
      position:absolute;
      top:100%;
      left:0;
      background:#111;
      border:1px solid #444;
      border-radius:4px;
      margin-top:2px;
      max-height:260px;
      overflow:hidden;
      min-width:100%;
      z-index:50;
      display:none;
      flex-direction:column;
    }
    .draft-filters-advanced .multi-filter.open .multi-filter-panel {
      display:flex;
    }
    .draft-filters-advanced .multi-filter-search {
      width:100%;
      box-sizing:border-box;
      padding:6px 8px;
      font-size:12px;
      border:none;
      border-bottom:1px solid #444;
      background:#1a1a1a;
      color:#eee;
      flex-shrink:0;
    }
    .draft-filters-advanced .multi-filter-options {
      overflow:auto;
      max-height:200px;
    }
    .draft-filters-advanced .multi-filter-empty {
      padding:8px;
      font-size:12px;
      color:#888;
    }
    .draft-filters-advanced .multi-filter-option {
      display:flex;
      align-items:center;
      padding:4px 6px;
      font-size:12px;
      cursor:pointer;
      color:#ddd;
    }
    .draft-filters-advanced .multi-filter-option:hover { background:#222; }
    .draft-filters-advanced .multi-filter-option input { margin-right:6px; }

    .draft-filters-advanced .range-filter {
      display:flex;
      flex-direction:column;
      gap:4px;
      min-width:168px;
      max-width:280px;
      font-size:12px;
      color:#ffaa22;
    }
    .draft-filters-advanced .range-filter-label {
      font-weight:bold;
      line-height:1.3;
    }
    .draft-filters-advanced .range-filter-range {
      font-weight:normal;
      color:#ddd;
      font-size:11px;
      font-variant-numeric:tabular-nums;
      white-space:nowrap;
    }
    .draft-filters-advanced .range-filter-sliders {
      position:relative;
      height:26px;
      margin-top:2px;
    }
    .draft-filters-advanced .range-filter-track {
      position:absolute;
      left:0; right:0; top:50%;
      height:6px;
      transform:translateY(-50%);
      border-radius:999px;
      background:
        linear-gradient(
          to right,
          #444 0%,
          #444 var(--range-min, 0%),
          #ff9900 var(--range-min, 0%),
          #ff9900 var(--range-max, 100%),
          #444 var(--range-max, 100%),
          #444 100%
        );
      pointer-events:none;
    }
    .draft-filters-advanced .range-filter-sliders input[type="range"] {
      position:absolute;
      left:0; top:0;
      width:100%;
      height:26px;
      margin:0;
      background:transparent;
      appearance:none;
      -webkit-appearance:none;
      pointer-events:none;
      z-index:3;
    }
    .draft-filters-advanced .range-filter-sliders input[type="range"]::-webkit-slider-runnable-track {
      height:6px;
      background:transparent;
    }
    .draft-filters-advanced .range-filter-sliders input[type="range"]::-moz-range-track {
      height:6px;
      background:transparent;
    }
    .draft-filters-advanced .range-filter-sliders input[type="range"].range-filter-min { z-index:3; }
    .draft-filters-advanced .range-filter-sliders input[type="range"].range-filter-max { z-index:4; }
    .draft-filters-advanced .range-filter-sliders input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance:none;
      appearance:none;
      width:14px;
      height:14px;
      border-radius:50%;
      background:#ff9900;
      border:2px solid #111;
      box-shadow:0 0 0 1px #aa6a00;
      margin-top:-4px;
      cursor:pointer;
      pointer-events:auto;
    }
    .draft-filters-advanced .range-filter-sliders input[type="range"]::-moz-range-thumb {
      width:14px;
      height:14px;
      border-radius:50%;
      background:#ff9900;
      border:2px solid #111;
      box-shadow:0 0 0 1px #aa6a00;
      cursor:pointer;
      pointer-events:auto;
    }

    tr.draft-row-my-leading td {
      background:#152515;
    }

    tr.draft-row-my-bid td {
      background:#1f1f14;
    }
  </style>
</head>

<body>

  <div id="nav"></div>

  <h1 class="gpsl-has-tip" data-gpsl-tip="Free-agent player draft. Bid while the auction window is open. Leading bids show as ghosts on Squad until settled — watch max 28, star cap, HG and U21." tabindex="0">Draft Auction</h1>

  <div class="draft-header-row">
    <div class="club-bank-status-left">
      <div id="clubBankBalance" class="club-bank-balance gpsl-has-tip" hidden data-gpsl-tip="Advisory transfer budget / club cash snapshot. Soft guidance — does not block bids." tabindex="0"></div>
      <div>
        <p id="draftStatus" class="status-note gpsl-has-tip" style="margin:0 0 6px 0;" data-gpsl-tip="Draft phase / window status for this season (open, closed, or countdown). Bidding only works while the window is live." tabindex="0"></p>
        <p id="creditPanel" class="status-note gpsl-has-tip" style="margin:0;" data-gpsl-tip="Join credits let you list free agents into the draft auction. Winning bids settle when each listing ends — watch squad overflow and star cap on Squad." tabindex="0"></p>
      </div>
    </div>
    <div id="draftCountdownContainer" class="draft-timer gpsl-has-tip" data-gpsl-tip="Countdown to draft open or close (UK time). Add to calendar so you do not miss the window." tabindex="0">
      <span id="draftCountdown"></span>
      <div id="draftLocalStart"></div>
      <p style="margin:6px 0 0;">
        <button type="button" id="draftAuctionCalBtn" class="button secondary" style="font-size:12px;padding:6px 10px;" title="Downloads 3 calendar files: opens, cutoff, random timer">Add auction times to calendar</button>
      </p>
    </div>
  </div>

  <div class="info-box" id="draftAuctionRules" aria-label="Draft auction instructions">
    <!-- Filled by draftauction_rules.js -->
  </div>

  <div class="draft-filters" role="search" aria-label="Filter draft auctions">
    <label>
      Player name
      <input type="text" id="draftPlayerSearch" placeholder="Search name (ignores accents)…" autocomplete="off">
    </label>
    <label>
      Leading club
      <select id="draftLeadingClubFilter">
        <option value="">All clubs</option>
      </select>
    </label>
    <label class="filter-check gpsl-has-tip" data-gpsl-tip="Show only auctions where your club has placed a bid (leading or outbid)." tabindex="0">
      <input type="checkbox" id="draftMyBidsOnly">
      <span>My club&apos;s bids only</span>
    </label>
    <label class="filter-check gpsl-has-tip" data-gpsl-tip="Auctions you hid from this list (view only — your bids stay active). Tick to show them again and Unhide." tabindex="0">
      <input type="checkbox" id="draftShowHidden">
      <span>Show hidden</span>
    </label>
    <div class="filter-action">
      <span class="filter-action-label">Club</span>
      <div class="filter-action-btns">
        <button type="button" id="draftMyClubFilterBtn" class="button button-secondary gpsl-has-tip" hidden data-gpsl-tip="Show only auctions your club is currently leading." tabindex="0">
          My Club
        </button>
      </div>
    </div>
    <div class="filter-action">
      <span class="filter-action-label">Scouting</span>
      <div class="filter-action-btns">
        <button type="button" id="draftScoutedFilterBtn" class="button button-secondary gpsl-has-tip" hidden data-gpsl-tip="Show only players on your scouting shortlist (☆ from GPDB / Scouting board)." tabindex="0">
          ★ My scouting targets
        </button>
      </div>
    </div>
    <div class="filter-action">
      <span class="filter-action-label">Nation</span>
      <div class="filter-action-btns">
        <button type="button" id="draftMyNationBtn" class="button button-secondary gpsl-has-tip" hidden data-gpsl-tip="Filter to your national team’s nation." tabindex="0">
          My National Team
        </button>
        <button type="button" id="draftMyClubNationBtn" class="button button-secondary gpsl-has-tip" hidden data-gpsl-tip="Filter to your club’s home nation (HG planning)." tabindex="0">
          My Club Nation
        </button>
      </div>
    </div>
    <label class="gpsl-has-tip" data-gpsl-tip="How often the listing table reloads (1–300 seconds). Refresh now forces an immediate update." tabindex="0">
      Auto-refresh (sec)
      <input type="number" id="draftRefreshInterval" min="1" max="300" step="1" value="60" aria-describedby="draftRefreshHint">
      <span id="draftRefreshHint" class="filter-hint">1–300 seconds (5 min max)</span>
    </label>
    <div class="filter-action">
      <span class="filter-action-label">Actions</span>
      <div class="filter-action-btns">
        <button type="button" id="draftClearFilters" class="button button-secondary">Clear filters</button>
        <button type="button" id="draftRefreshBtn" class="button button-secondary">Refresh now</button>
      </div>
    </div>
  </div>
  <div class="draft-filters-advanced" id="draftAdvancedFilters" aria-label="Player attribute filters">
    <div class="multi-filter" data-col="Nation">
      <div class="multi-filter-label">Nation</div>
      <div class="multi-filter-control" tabindex="0">All</div>
      <div class="multi-filter-panel">
        <input type="search" class="multi-filter-search" placeholder="Search…" autocomplete="off">
        <div class="multi-filter-options"></div>
      </div>
    </div>
    <div class="multi-filter" data-col="Position">
      <div class="multi-filter-label">Position</div>
      <div class="multi-filter-control" tabindex="0">All</div>
      <div class="multi-filter-panel">
        <input type="search" class="multi-filter-search" placeholder="Search…" autocomplete="off">
        <div class="multi-filter-options"></div>
      </div>
    </div>
    <div class="multi-filter" data-col="Playstyle">
      <div class="multi-filter-label">Playstyle</div>
      <div class="multi-filter-control" tabindex="0">All</div>
      <div class="multi-filter-panel">
        <input type="search" class="multi-filter-search" placeholder="Search…" autocomplete="off">
        <div class="multi-filter-options"></div>
      </div>
    </div>
    <div class="range-filter" data-col="Age">
      <div class="range-filter-label gpsl-has-tip" data-gpsl-tip="Filter by player age. Use − / + steppers for ±1 when shown." tabindex="0">Age <span class="range-filter-range" id="draftRange-Age">(—)</span></div>
      <div class="range-filter-sliders" id="draftSliders-Age">
        <div class="range-filter-track"></div>
        <input type="range" class="range-filter-min" id="draftRange-Age-min" min="0" max="1" value="0" step="1" aria-label="Age minimum" disabled>
        <input type="range" class="range-filter-max" id="draftRange-Age-max" min="0" max="1" value="1" step="1" aria-label="Age maximum" disabled>
      </div>
    </div>
    <div class="range-filter" data-col="Rating">
      <div class="range-filter-label gpsl-has-tip" data-gpsl-tip="Filter by overall rating. Use − / + for ±1 when shown." tabindex="0">Rating <span class="range-filter-range" id="draftRange-Rating">(—)</span></div>
      <div class="range-filter-sliders" id="draftSliders-Rating">
        <div class="range-filter-track"></div>
        <input type="range" class="range-filter-min" id="draftRange-Rating-min" min="0" max="1" value="0" step="1" aria-label="Rating minimum" disabled>
        <input type="range" class="range-filter-max" id="draftRange-Rating-max" min="0" max="1" value="1" step="1" aria-label="Rating maximum" disabled>
      </div>
    </div>
    <div class="range-filter" data-col="current_bid">
      <div class="range-filter-label gpsl-has-tip" data-gpsl-tip="Filter by highest bid amount. Money steps are ₿500,000 when using − / + steppers." tabindex="0">Current bid <span class="range-filter-range" id="draftRange-current_bid">(—)</span></div>
      <div class="range-filter-sliders" id="draftSliders-current_bid">
        <div class="range-filter-track"></div>
        <input type="range" class="range-filter-min" id="draftRange-current_bid-min" min="0" max="1" value="0" step="1" aria-label="Current bid minimum" disabled>
        <input type="range" class="range-filter-max" id="draftRange-current_bid-max" min="0" max="1" value="1" step="1" aria-label="Current bid maximum" disabled>
      </div>
    </div>
    <div class="range-filter" data-col="contract_wage">
      <div class="range-filter-label gpsl-has-tip" data-gpsl-tip="Filter by seasonal wage (signed wage, or forecast % of MV for free agents)." tabindex="0">Wage / season <span class="range-filter-range" id="draftRange-contract_wage">(—)</span></div>
      <div class="range-filter-sliders" id="draftSliders-contract_wage">
        <div class="range-filter-track"></div>
        <input type="range" class="range-filter-min" id="draftRange-contract_wage-min" min="0" max="1" value="0" step="1" aria-label="Wage minimum" disabled>
        <input type="range" class="range-filter-max" id="draftRange-contract_wage-max" min="0" max="1" value="1" step="1" aria-label="Wage maximum" disabled>
      </div>
    </div>
  </div>
  <p id="draftRefreshNote" class="draft-refresh-note">Auto-refresh every minute</p>
  <p id="draftFilterSummary" class="draft-filter-summary" hidden></p>

  <div class="panel">
    <table class="gpsl-table">
      <thead>
        <tr>
          <th class="col-fav gpsl-has-tip" data-gpsl-tip="Star a thread to pin it under Saved draft auctions in Transfer Centre." tabindex="0">★</th>
          <th class="col-thumb"></th>
          <th class="col-player">Player</th>
          <th class="col-compact">Pos</th>
          <th class="col-compact gpsl-has-tip" data-gpsl-tip="Overall rating. Also drives automatic star status (usually ≥79)." tabindex="0">Rating</th>
          <th class="col-money gpsl-has-tip" data-gpsl-tip="GPSL market value — usual reference for bidding. Minimum bid rules still apply on the player page." tabindex="0">Market Value</th>
          <th class="col-money gpsl-has-tip" data-gpsl-tip="Highest bid so far. Use Bid / Max bid on the player page. Auto max-bid raises for you up to your ceiling when rivals bid.

Fair play: do not min-step probe just to inflate prices against someone’s max bid." tabindex="0">Highest Bid</th>
          <th class="col-leading-club gpsl-has-tip" data-gpsl-tip="Club currently holding the high bid (empty if none yet)." tabindex="0">Leading Club</th>
          <th class="col-owner gpsl-has-tip" data-gpsl-tip="Owner tag of the leading club (when known)." tabindex="0">Owner</th>
          <th class="col-compact gpsl-has-tip" data-gpsl-tip="Open the player auction page to place or raise a bid (or view history)." tabindex="0">Bid</th>
        </tr>
      </thead>
      <tbody id="draftTableBody"></tbody>
    </table>
  </div>

  <script type="module">
    /* ============================================================
       IMPORT SHARED ENGINE
       ============================================================ */

    import { initGlobal, loadGlobalSettings } from "./global.js";
    import { initGpslInfoTips } from "./gpsl_info_tips.js";
    import { DRAFT_TIPS } from "./owner_page_tips.js";
    import { mountClubBankBalance } from "./club_bank_balance_ui.js?v=20260811-budget-refresh";
    import { downloadIcsEach, draftAuctionTimelineEvents } from "./calendar_ics.js";
    import { getDraftTimelineFromStart } from "./draft_timeline.js";
    import { renderDraftAuctionRules } from "./draftauction_rules.js?v=20260812-draft-detail";
    import {
      supabase,
      getUKNow,
      isDraftAuctionEnded,
      getDraftCredits,
      canClubBidOnPlayerDraftSync,
      getEffectiveDraftPhase,
      draftPhaseLabel,
      getDraftBiddingOpen,
      fetchDraftBidsGroupedForPlayers,
      highestDraftBid,
      normalizeKonamiId,
    } from "./draft_engine.js";
    import {
      loadDraftFavouriteIds,
      toggleDraftFavourite,
      sortDraftListingsByFavourite,
      favouriteStarChar,
      favouriteButtonLabel,
    } from "./draft_favourites.js";
    import {
      loadDraftHiddenIds,
      toggleDraftPlayerHidden,
      draftHideButtonLabel,
    } from "./draft_hidden.js?v=20260811-draft-hide";
    import {
      loadClubsMap,
      fullClubName,
      ownerTagForClub,
      ownerIdForClub,
      ownerTagLinkHtml,
    } from "./clubs_lookup.js";
    import {
      playerThumbLinkHtml,
      playerNameLinkHtml,
    } from "./player_links.js";
    import { textMatchesSearch } from "./search_normalize.js";
    import {
      loadScoutingTargetMap,
      isScoutingAvailable,
      scoutingSetupHint,
    } from "./scouting_targets.js?v=20260805-owner-scout";
    import { loadWagePercentages } from "./wages.js";
    import { createDraftAdvancedFilterController } from "./draft_auction_filters.js?v=20260811-step-pairs";
    import {
      loadMyNation,
      resolveNationFromLabel,
      gpdbNationFilterValues,
      clubNationFilterValues,
      renderNationFlag,
    } from "./international.js?v=20260724-club-nation-filter";

    /* ============================================================
       MODULE A: Global State
       ============================================================ */

    let buyerShortName = null;
    let buyerClubNation = null;
    let myNationalTeam = null;
    let myClubNation = null;

    let draftEnabled = false;
    let draftAuctionStartTimeUK = null;
    let favouriteIds = new Set();
    let hiddenIds = new Set();
    /** @type {Map<string, number>} */
    let scoutingTargetMap = new Map();
    let scoutedOnly = false;
    let myClubLeadingOnly = false;
    let advancedFiltersRestored = false;

    const advancedFilters = createDraftAdvancedFilterController({
      rootId: "draftAdvancedFilters",
      onChange: () => {
        renderDraftTable();
        savePersistedDraftFilters();
      },
    });
    let draftTableWired = false;
    let draftListingsPoll = null;
    let draftListingsPollMs = null;
    let listingsLoading = false;
    let draftRowsCache = [];
    const DRAFT_REFRESH_DEFAULT_SEC = 60;
    const DRAFT_REFRESH_MIN_SEC = 1;
    const DRAFT_REFRESH_MAX_SEC = 300;
    const DRAFT_FILTER_STORAGE_PREFIX = "gpsl_draftauction_filters:";

    function draftFilterStorageKey() {
      return `${DRAFT_FILTER_STORAGE_PREFIX}${buyerShortName || "anonymous"}`;
    }

    function readPersistedDraftFilters() {
      try {
        const raw = localStorage.getItem(draftFilterStorageKey());
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        return parsed && typeof parsed === "object" ? parsed : null;
      } catch {
        return null;
      }
    }

    function savePersistedDraftFilters() {
      try {
        localStorage.setItem(
          draftFilterStorageKey(),
          JSON.stringify(getDraftFilterState())
        );
      } catch {
        /* private mode / quota */
      }
    }

    function restorePersistedDraftFilters() {
      const saved = readPersistedDraftFilters();
      if (!saved) return;

      const search = document.getElementById("draftPlayerSearch");
      const leading = document.getElementById("draftLeadingClubFilter");
      const myBids = document.getElementById("draftMyBidsOnly");
      const showHidden = document.getElementById("draftShowHidden");
      const scoutedBtn = document.getElementById("draftScoutedFilterBtn");

      if (search && typeof saved.nameQuery === "string") {
        search.value = saved.nameQuery;
      }
      if (leading && typeof saved.leadingClub === "string") {
        if ([...leading.options].some((o) => o.value === saved.leadingClub)) {
          leading.value = saved.leadingClub;
        }
      }
      if (myBids && buyerShortName && typeof saved.myBidsOnly === "boolean") {
        myBids.checked = saved.myBidsOnly;
      }
      if (showHidden && typeof saved.showHidden === "boolean") {
        showHidden.checked = saved.showHidden;
      }
      if (typeof saved.scoutedOnly === "boolean") {
        scoutedOnly = saved.scoutedOnly && Boolean(buyerShortName);
        if (scoutedBtn) scoutedBtn.classList.toggle("is-active", scoutedOnly);
      }
      if (typeof saved.myClubLeadingOnly === "boolean") {
        myClubLeadingOnly = saved.myClubLeadingOnly && Boolean(buyerShortName);
        syncDraftMyClubButton();
        if (myClubLeadingOnly && leading && buyerShortName) {
          if ([...leading.options].some((o) => o.value === buyerShortName)) {
            leading.value = buyerShortName;
          }
        }
      }
      // Advanced multi/range restored after first rebuildFromRows (needs live bounds)

      const refreshInterval = document.getElementById("draftRefreshInterval");
      if (refreshInterval && typeof saved.refreshIntervalSec === "number") {
        refreshInterval.value = String(
          Math.min(
            DRAFT_REFRESH_MAX_SEC,
            Math.max(DRAFT_REFRESH_MIN_SEC, Math.round(saved.refreshIntervalSec))
          )
        );
      }
    }

    function getDraftRefreshIntervalSec() {
      const el = document.getElementById("draftRefreshInterval");
      const n = Number(el?.value);
      if (!Number.isFinite(n)) return DRAFT_REFRESH_DEFAULT_SEC;
      return Math.min(
        DRAFT_REFRESH_MAX_SEC,
        Math.max(DRAFT_REFRESH_MIN_SEC, Math.round(n))
      );
    }

    function getDraftRefreshIntervalMs() {
      return getDraftRefreshIntervalSec() * 1000;
    }

    function clampDraftRefreshIntervalInput() {
      const el = document.getElementById("draftRefreshInterval");
      if (!el) return;
      el.value = String(getDraftRefreshIntervalSec());
    }

    function formatAutoRefreshLabel(sec) {
      if (sec < 60) return `Auto-refresh every ${sec}s`;
      if (sec === 60) return "Auto-refresh every minute";
      if (sec % 60 === 0) {
        const mins = sec / 60;
        return `Auto-refresh every ${mins} min`;
      }
      return `Auto-refresh every ${sec}s`;
    }

    function updateDraftRefreshNote(lastUpdatedText) {
      const note = document.getElementById("draftRefreshNote");
      if (!note) return;
      const base = formatAutoRefreshLabel(getDraftRefreshIntervalSec());
      note.textContent = lastUpdatedText ? `${lastUpdatedText} · ${base}` : base;
    }

    function applyDraftRefreshInterval() {
      clampDraftRefreshIntervalInput();
      if (draftEnabled && draftAuctionStartTimeUK) {
        ensureDraftListingsPoll(getDraftRefreshIntervalMs());
      }
      updateDraftRefreshNote();
    }

    function stopDraftListingsPoll() {
      if (draftListingsPoll) clearInterval(draftListingsPoll);
      draftListingsPoll = null;
      draftListingsPollMs = null;
    }

    function ensureDraftListingsPoll(intervalMs = getDraftRefreshIntervalMs()) {
      if (draftListingsPollMs === intervalMs && draftListingsPoll) return;
      stopDraftListingsPoll();
      draftListingsPollMs = intervalMs;
      draftListingsPoll = setInterval(() => loadDraftListings(), intervalMs);
    }

    function wireDraftRefreshButton() {
      const btn = document.getElementById("draftRefreshBtn");
      if (!btn) return;
      btn.addEventListener("click", () => refreshDraftListingsManual());
    }

    async function refreshDraftListingsManual() {
      if (listingsLoading) return;
      const btn = document.getElementById("draftRefreshBtn");
      const note = document.getElementById("draftRefreshNote");
      if (btn) {
        btn.disabled = true;
        btn.textContent = "Refreshing…";
      }
      try {
        await loadDraftListings();
        if (note) {
          const time = new Date().toLocaleTimeString([], {
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
          });
          updateDraftRefreshNote(`Updated ${time}`);
        }
      } catch (err) {
        console.error(err);
        if (note) note.textContent = "Refresh failed — try again";
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.textContent = "Refresh now";
        }
      }
    }

    /* ============================================================
       MODULE B: Navigation
       ============================================================ */

    /* ============================================================
       MODULE C: Owner Club ShortName
       ============================================================ */

    async function loadBuyerClubShortName(authId) {
      const { data, error } = await supabase
        .from("Clubs")
        .select("ShortName, Nation")
        .eq("owner_id", authId)
        .single();

      buyerShortName = error || !data ? null : data.ShortName;
      buyerClubNation = error || !data ? null : data.Nation || null;
    }

    async function refreshDraftNationFilterButtons() {
      myNationalTeam = await loadMyNation(supabase);
      myClubNation = buyerClubNation
        ? await resolveNationFromLabel(supabase, buyerClubNation)
        : null;

      const natBtn = document.getElementById("draftMyNationBtn");
      const clubBtn = document.getElementById("draftMyClubNationBtn");

      if (natBtn) {
        if (myNationalTeam?.code) {
          natBtn.hidden = false;
          natBtn.innerHTML = `${renderNationFlag(myNationalTeam, "sm")} My National Team (${myNationalTeam.name})`;
        } else {
          natBtn.hidden = true;
        }
      }

      if (clubBtn) {
        if (myClubNation?.name) {
          clubBtn.hidden = false;
          clubBtn.innerHTML = `${renderNationFlag(myClubNation, "sm")} My Club Nation (${myClubNation.name})`;
        } else {
          clubBtn.hidden = true;
        }
      }
    }

    function applyDraftNationFilter(values, emptyAlert) {
      if (!values?.length) {
        if (emptyAlert) alert(emptyAlert);
        return;
      }
      advancedFilters.setMultiSelected("Nation", values);
      renderDraftTable();
      savePersistedDraftFilters();
    }

    /* ============================================================
       MODULE D: Draft Credits Panel
       ============================================================ */

    async function updateCreditPanel() {
      if (!buyerShortName || !draftEnabled) {
        document.getElementById("creditPanel").textContent = "";
        return;
      }

      const { earned, used, credits } = await getDraftCredits(
        buyerShortName,
        draftAuctionStartTimeUK
      );

      document.getElementById("creditPanel").innerHTML = `
        <b>Draft Credits:</b> ${credits}<br>
        <span style="font-size:11px;color:#aaa;">
          Earned: ${earned} | Used: ${used}
        </span>
      `;
    }

    /* ============================================================
       MODULE E: Main Page Init
       ============================================================ */

    document.addEventListener("DOMContentLoaded", async () => {
      initGpslInfoTips();
      renderDraftAuctionRules();

      const { data: { user } } = await supabase.auth.getUser();
      if (!user) {
        window.location = "login.html";
        return;
      }

      await initGlobal();
      mountClubBankBalance("clubBankBalance", { advisory: true }).catch((err) =>
        console.warn("advisory transfer budget:", err)
      );

      const settings = await loadGlobalSettings();
      draftEnabled = settings.draftEnabled;
      draftAuctionStartTimeUK = settings.draftStart;

      const draftCalBtn = document.getElementById("draftAuctionCalBtn");
      if (draftCalBtn) {
        draftCalBtn.hidden = !draftAuctionStartTimeUK;
        draftCalBtn.onclick = () => {
          if (!draftAuctionStartTimeUK) return;
          const timeline = getDraftTimelineFromStart(
            draftAuctionStartTimeUK instanceof Date
              ? draftAuctionStartTimeUK
              : new Date(draftAuctionStartTimeUK)
          );
          if (!timeline) return;
          const events = draftAuctionTimelineEvents({
            id: "player",
            label: "GPSL player draft",
            startAt: timeline.start,
            cutoffAt: timeline.cutoff,
            randomStartAt: timeline.randomStart,
            url: new URL("draftauction.html", window.location.href).href,
            includeCutoff: true,
            filePrefix: "gpsl-player-draft",
            cutoffDescription:
              "Day-2 cutoff (6pm UK) — no new bids or free-agent openings after this time.",
          });
          downloadIcsEach(events);
        };
      }

      await loadBuyerClubShortName(user.id);
      await refreshDraftNationFilterButtons();
      await loadDraftScoutingTargets();
      advancedFilters.setWageSettings(await loadWagePercentages(supabase));
      advancedFilters.wire();
      await populateLeadingClubFilter();
      restorePersistedDraftFilters();
      applyDraftRefreshInterval();
      favouriteIds = await loadDraftFavouriteIds(supabase, buyerShortName);
      hiddenIds = loadDraftHiddenIds(buyerShortName);
      wireDraftTableActions();
      wireDraftRefreshButton();
      wireDraftFilters();
      await updateCreditPanel();
      await loadDraftListings();
    });

    function syncDraftMyClubButton() {
      const btn = document.getElementById("draftMyClubFilterBtn");
      if (!btn) return;
      btn.hidden = !buyerShortName;
      btn.classList.toggle("is-active", myClubLeadingOnly && Boolean(buyerShortName));
    }

    async function loadDraftScoutingTargets() {
      const btn = document.getElementById("draftScoutedFilterBtn");
      scoutingTargetMap = new Map();
      if (!buyerShortName) {
        scoutedOnly = false;
        myClubLeadingOnly = false;
        syncDraftMyClubButton();
        if (btn) {
          btn.hidden = true;
          btn.classList.remove("is-active");
        }
        return;
      }
      syncDraftMyClubButton();
      try {
        scoutingTargetMap = await loadScoutingTargetMap(supabase, buyerShortName);
      } catch (err) {
        console.warn("draft scouting targets:", err);
        scoutingTargetMap = new Map();
      }
      if (btn) {
        btn.hidden = false;
        btn.classList.toggle("is-active", scoutedOnly);
        if (!isScoutingAvailable()) {
          btn.title = scoutingSetupHint();
        } else {
          btn.title = "Show only draft threads for players on your scouting list";
        }
      }
    }

    function applyDraftFavouriteLocal(konamiId, isFav) {
      const key = String(konamiId);
      if (isFav) favouriteIds.add(key);
      else favouriteIds.delete(key);

      for (const row of draftRowsCache) {
        if (String(row.player.Konami_ID) === key) {
          row.isFav = isFav;
        }
      }

      draftRowsCache.sort((a, b) => {
        const aFav = a.isFav ? 0 : 1;
        const bFav = b.isFav ? 0 : 1;
        return aFav - bFav;
      });

      renderDraftTable();
    }

    function applyDraftHiddenLocal(konamiId, isHidden) {
      const key = String(konamiId);
      for (const row of draftRowsCache) {
        if (String(row.player.Konami_ID) === key) {
          row.isHidden = isHidden;
        }
      }
      renderDraftTable();
    }

    function wireDraftTableActions() {
      if (draftTableWired) return;
      draftTableWired = true;

      const tbody = document.getElementById("draftTableBody");
      tbody.addEventListener("click", async (e) => {
        const hideBtn = e.target.closest(".draft-hide-btn");
        if (hideBtn) {
          e.preventDefault();
          e.stopPropagation();
          if (!buyerShortName) {
            alert("Link a club to your account to hide draft threads.");
            return;
          }
          const konamiId = hideBtn.getAttribute("data-konami-id");
          const nowHidden = toggleDraftPlayerHidden(
            buyerShortName,
            hiddenIds,
            konamiId
          );
          applyDraftHiddenLocal(konamiId, nowHidden);
          return;
        }

        const favBtn = e.target.closest(".fav-btn");
        if (favBtn) {
          e.preventDefault();
          e.stopPropagation();
          if (!buyerShortName) {
            alert("Link a club to your account to save draft auctions.");
            return;
          }
          const konamiId = favBtn.getAttribute("data-konami-id");
          const wasFav = favouriteIds.has(String(konamiId));
          favBtn.disabled = true;

          applyDraftFavouriteLocal(konamiId, !wasFav);

          try {
            const isFav = await toggleDraftFavourite(supabase, buyerShortName, konamiId);
            if (isFav !== !wasFav) {
              applyDraftFavouriteLocal(konamiId, isFav);
            }
          } catch (err) {
            applyDraftFavouriteLocal(konamiId, wasFav);
            console.error(err);
            alert(err.message || "Could not update saved draft auction.");
          } finally {
            favBtn.disabled = false;
          }
          return;
        }

        const bidBtn = e.target.closest(".bid-btn.enabled, .bid-btn.view-only");
        if (bidBtn) {
          const konamiId = bidBtn.getAttribute("data-konami-id");
          window.location = `draftauction_player.html?player=${konamiId}`;
        }
      });
    }

    function escapeFilterAttr(text) {
      return String(text ?? "")
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/</g, "&lt;");
    }

    async function populateLeadingClubFilter() {
      const sel = document.getElementById("draftLeadingClubFilter");
      if (!sel) return;

      const saved = sel.value;
      const { data } = await supabase
        .from("Clubs")
        .select("ShortName, Club")
        .neq("ShortName", "FOREIGN")
        .order("Club");

      const options = [['', 'All clubs']];
      for (const row of data || []) {
        options.push([row.ShortName, row.Club || row.ShortName]);
      }

      sel.innerHTML = options
        .map(([value, label]) =>
          `<option value="${escapeFilterAttr(value)}">${escapeFilterAttr(label)}</option>`
        )
        .join("");

      if ([...sel.options].some((o) => o.value === saved)) {
        sel.value = saved;
      }
    }

    function wireDraftFilters() {
      const search = document.getElementById("draftPlayerSearch");
      const leading = document.getElementById("draftLeadingClubFilter");
      const myBids = document.getElementById("draftMyBidsOnly");
      const showHidden = document.getElementById("draftShowHidden");
      const scoutedBtn = document.getElementById("draftScoutedFilterBtn");
      const myClubBtn = document.getElementById("draftMyClubFilterBtn");
      const myNationBtn = document.getElementById("draftMyNationBtn");
      const myClubNationBtn = document.getElementById("draftMyClubNationBtn");
      const refreshInterval = document.getElementById("draftRefreshInterval");
      const clearBtn = document.getElementById("draftClearFilters");

      let searchTimer = null;
      search?.addEventListener("input", () => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => {
          renderDraftTable();
          savePersistedDraftFilters();
        }, 200);
      });
      leading?.addEventListener("change", () => {
        myClubLeadingOnly = Boolean(
          buyerShortName && leading.value === buyerShortName
        );
        syncDraftMyClubButton();
        renderDraftTable();
        savePersistedDraftFilters();
      });
      myBids?.addEventListener("change", () => {
        renderDraftTable();
        savePersistedDraftFilters();
      });
      showHidden?.addEventListener("change", () => {
        renderDraftTable();
        savePersistedDraftFilters();
      });
      scoutedBtn?.addEventListener("click", () => {
        if (!buyerShortName) return;
        if (!isScoutingAvailable()) {
          alert(scoutingSetupHint());
          return;
        }
        scoutedOnly = !scoutedOnly;
        scoutedBtn.classList.toggle("is-active", scoutedOnly);
        renderDraftTable();
        savePersistedDraftFilters();
      });
      myClubBtn?.addEventListener("click", () => {
        if (!buyerShortName) return;
        myClubLeadingOnly = !myClubLeadingOnly;
        syncDraftMyClubButton();
        // Keep Leading club select in sync when My Club is on
        const leadingSel = document.getElementById("draftLeadingClubFilter");
        if (leadingSel) {
          leadingSel.value = myClubLeadingOnly ? buyerShortName : "";
        }
        renderDraftTable();
        savePersistedDraftFilters();
      });
      myNationBtn?.addEventListener("click", () => {
        if (!myNationalTeam?.code) return;
        const values = gpdbNationFilterValues(
          myNationalTeam,
          advancedFilters.getMultiOptions("Nation")
        );
        applyDraftNationFilter(
          values,
          `No draft nations match ${myNationalTeam.name}.`
        );
      });
      myClubNationBtn?.addEventListener("click", () => {
        const label = myClubNation?.name || buyerClubNation;
        if (!label) return;
        const values = clubNationFilterValues(
          label,
          advancedFilters.getMultiOptions("Nation")
        );
        applyDraftNationFilter(
          values,
          `No draft nations match club nation ${label}.`
        );
      });
      refreshInterval?.addEventListener("change", () => {
        applyDraftRefreshInterval();
        savePersistedDraftFilters();
      });
      refreshInterval?.addEventListener("blur", () => {
        applyDraftRefreshInterval();
        savePersistedDraftFilters();
      });
      clearBtn?.addEventListener("click", () => {
        if (search) search.value = "";
        if (leading) leading.value = "";
        if (myBids) myBids.checked = false;
        if (showHidden) showHidden.checked = false;
        scoutedOnly = false;
        myClubLeadingOnly = false;
        scoutedBtn?.classList.remove("is-active");
        syncDraftMyClubButton();
        advancedFilters.clear();
        renderDraftTable();
        savePersistedDraftFilters();
      });

      if (myBids && !buyerShortName) {
        myBids.disabled = true;
        myBids.title = "Link a club to your account to use this filter";
      }
      if (showHidden && !buyerShortName) {
        showHidden.disabled = true;
        showHidden.title = "Link a club to hide or restore draft threads";
      }
    }

    function getDraftFilterState() {
      return {
        nameQuery: document.getElementById("draftPlayerSearch")?.value.trim() || "",
        leadingClub: document.getElementById("draftLeadingClubFilter")?.value || "",
        myBidsOnly: document.getElementById("draftMyBidsOnly")?.checked === true,
        showHidden: document.getElementById("draftShowHidden")?.checked === true,
        scoutedOnly,
        myClubLeadingOnly,
        refreshIntervalSec: getDraftRefreshIntervalSec(),
        ...advancedFilters.getPersistState(),
      };
    }

    function applyDraftFilters(rows) {
      const { nameQuery, leadingClub, myBidsOnly, showHidden } =
        getDraftFilterState();
      let filtered = rows;

      if (nameQuery) {
        filtered = filtered.filter((row) =>
          textMatchesSearch(row.playerName, nameQuery)
        );
      }

      if (leadingClub) {
        filtered = filtered.filter((row) => row.leadingClubShort === leadingClub);
      } else if (myClubLeadingOnly && buyerShortName) {
        filtered = filtered.filter(
          (row) => row.leadingClubShort === buyerShortName
        );
      }

      if (myBidsOnly && buyerShortName) {
        filtered = filtered.filter((row) => row.myClubBid);
      }

      if (!showHidden) {
        filtered = filtered.filter((row) => !row.isHidden);
      }

      if (scoutedOnly) {
        if (!scoutingTargetMap.size) {
          filtered = [];
        } else {
          filtered = filtered.filter((row) =>
            scoutingTargetMap.has(String(row.player?.Konami_ID ?? ""))
          );
        }
      }

      filtered = filtered.filter((row) => advancedFilters.rowPasses(row));

      return filtered;
    }

    function updateDraftFilterSummary(shown, total) {
      const el = document.getElementById("draftFilterSummary");
      if (!el) return;

      const { nameQuery, leadingClub, myBidsOnly, showHidden } =
        getDraftFilterState();
      const hiddenCount = draftRowsCache.filter((r) => r.isHidden).length;
      const active =
        nameQuery ||
        leadingClub ||
        myBidsOnly ||
        scoutedOnly ||
        myClubLeadingOnly ||
        (!showHidden && hiddenCount > 0) ||
        advancedFilters.isActive();

      if (!active || total === 0) {
        el.hidden = true;
        el.textContent = "";
        return;
      }

      el.hidden = false;
      const hideNote =
        !showHidden && hiddenCount > 0
          ? ` · ${hiddenCount} hidden`
          : showHidden && hiddenCount > 0
            ? ` · including ${hiddenCount} hidden`
            : "";
      el.textContent =
        shown === total
          ? `Showing all ${total} thread${total === 1 ? "" : "s"} (filtered)${hideNote}`
          : `Showing ${shown} of ${total} thread${total === 1 ? "" : "s"}${hideNote}`;
    }

    function renderDraftTable() {
      const tbody = document.getElementById("draftTableBody");
      if (!tbody) return;

      tbody.innerHTML = "";
      const filtered = applyDraftFilters(draftRowsCache);
      updateDraftFilterSummary(filtered.length, draftRowsCache.length);

      if (!draftRowsCache.length) {
        return;
      }

      if (!filtered.length) {
        tbody.innerHTML =
          `<tr><td colspan="10">No threads match your filters.</td></tr>`;
        return;
      }

      for (const row of filtered) {
        const tr = document.createElement("tr");
        if (row.isFav) tr.classList.add("draft-fav-row");
        if (row.isHidden) tr.classList.add("draft-row-hidden");
        if (row.myClubLeading) tr.classList.add("draft-row-my-leading");
        else if (row.myClubBid) tr.classList.add("draft-row-my-bid");

        const hideTip = row.isHidden
          ? "Show this auction in the list again (does not change your bid)."
          : DRAFT_TIPS.hide;
        const hideBtn = row.myClubBid
          ? `<button
              type="button"
              class="draft-hide-btn${row.isHidden ? " is-hidden-row" : ""} gpsl-has-tip"
              data-konami-id="${row.player.Konami_ID}"
              data-gpsl-tip="${hideTip.replace(/"/g, "&quot;")}"
              tabindex="0"
            >${draftHideButtonLabel(row.isHidden)}</button>`
          : "";

        tr.innerHTML = `
          <td class="col-fav">
            <button
              type="button"
              class="fav-btn${row.isFav ? " fav-on" : ""} gpsl-has-tip"
              data-konami-id="${row.player.Konami_ID}"
              aria-label="${favouriteButtonLabel(row.isFav)}"
              data-gpsl-tip="${DRAFT_TIPS.fav.replace(/"/g, "&quot;")}"
              tabindex="0"
            >${favouriteStarChar(row.isFav)}</button>
          </td>
          <td class="col-thumb">${playerThumbLinkHtml(row.player.Konami_ID, {
            className: "draft-thumb",
            alt: row.playerName,
          })}</td>
          <td class="col-player">${playerNameLinkHtml(row.player.Konami_ID, row.playerName)}</td>
          <td class="col-compact">${row.player.Position}</td>
          <td class="col-compact">${row.player.Rating}</td>
          <td class="col-money">₿ ${Number(row.player.market_value).toLocaleString("en-GB")}</td>
          <td class="col-money">${row.highestAmount !== null ? `₿ ${Number(row.highestAmount).toLocaleString("en-GB")}` : "None"}</td>
          <td class="col-leading-club">${row.leadingClubFull}</td>
          <td class="col-owner">${row.leadingOwner}</td>
          <td class="col-compact">
            <div class="draft-row-actions">
              <button
                class="bid-btn ${row.btnClass}"
                data-konami-id="${row.player.Konami_ID}"
                ${row.auctionEnded || row.canBid ? "" : "disabled"}
              >
                ${row.btnLabel}
              </button>
              ${hideBtn}
            </div>
          </td>
        `;
        tbody.appendChild(tr);
      }
    }

    /* ============================================================
       MODULE F: Load Draft Listings
       ============================================================ */

    async function loadDraftListings() {
      if (listingsLoading) return;
      listingsLoading = true;
      const tbody = document.getElementById("draftTableBody");
      tbody.innerHTML = "";

      const nowUK = getUKNow();
      const statusEl = document.getElementById("draftStatus");

      try {
      if (!draftEnabled || !draftAuctionStartTimeUK) {
        stopDraftListingsPoll();
        if (statusEl) statusEl.textContent = "";
        tbody.innerHTML = `<tr><td colspan="10">Draft auction is not active.</td></tr>`;
        return;
      }

      const open = getDraftBiddingOpen("player");
      const phase = getEffectiveDraftPhase(
        nowUK,
        draftAuctionStartTimeUK,
        open === null ? {} : { biddingOpen: open }
      );
      if (statusEl) {
        statusEl.textContent = draftPhaseLabel(phase);
      }

      if (nowUK < draftAuctionStartTimeUK) {
        stopDraftListingsPoll();
        tbody.innerHTML = `<tr><td colspan="10">Draft auction has not started yet.</td></tr>`;
        return;
      }

      ensureDraftListingsPoll();

      const { data: listings } = await supabase
        .from("Player_Transfer_Listings")
        .select("id, player_id, reserve_price, status, current_highest_bid, current_highest_bidder")
        .eq("listing_type", "draft")
        .eq("status", "Active");

      if (!listings || !listings.length) {
        draftRowsCache = [];
        updateDraftFilterSummary(0, 0);
        tbody.innerHTML = `<tr><td colspan="10">No active draft auctions.</td></tr>`;
        return;
      }

      const sortedListings = sortDraftListingsByFavourite(listings, favouriteIds);

      const playerIds = [...new Set(
        listings
          .map(l => Number(l.player_id))
          .filter(v => !Number.isNaN(v))
      )];

      const playerIdKeys = playerIds.map((id) => normalizeKonamiId(id));

      const [
        { data: players },
        bidsByPlayer,
        ,
        draftCreditsResult,
      ] = await Promise.all([
        supabase
          .from("Players")
          .select("Konami_ID, Name, Position, Rating, market_value, Nation, Age, Playstyle, contract_wage")
          .in("Konami_ID", playerIds),
        fetchDraftBidsGroupedForPlayers(playerIdKeys, draftAuctionStartTimeUK),
        loadClubsMap(),
        buyerShortName
          ? getDraftCredits(buyerShortName, draftAuctionStartTimeUK)
          : Promise.resolve({ credits: 0 }),
      ]);

      const playerMap = new Map((players || []).map(p => [Number(p.Konami_ID), p]));
      const draftCredits = draftCreditsResult?.credits ?? 0;

      const auctionEnded = isDraftAuctionEnded(nowUK, draftAuctionStartTimeUK);

      if (statusEl && auctionEnded && listings.length) {
        statusEl.textContent =
          "Bidding closed (random finish reached). Results settle after 7pm transfer auctions finish — listings may still show Active briefly.";
      }

      draftRowsCache = [];

      for (const listing of sortedListings) {
        const playerIdNum = Number(listing.player_id);
        const player = playerMap.get(playerIdNum);
        if (!player) continue;

        const playerKey = normalizeKonamiId(listing.player_id);
        const playerBids = bidsByPlayer.get(playerKey) || [];

        let highestAmount = null;
        let leadingClubShort = null;

        const top = highestDraftBid(playerBids);
        if (top) {
          highestAmount = top.bid_amount;
          leadingClubShort = top.bidder_club_id;
        }

        if (highestAmount == null && listing.current_highest_bid != null) {
          highestAmount = Number(listing.current_highest_bid);
          leadingClubShort = listing.current_highest_bidder || null;
        }

        const leadingClubFull = leadingClubShort
          ? (fullClubName(leadingClubShort) || leadingClubShort)
          : "None";
        const leadingOwner = leadingClubShort
          ? ownerTagLinkHtml(
              ownerTagForClub(leadingClubShort),
              ownerIdForClub(leadingClubShort)
            ) || "—"
          : "—";

        const myClubBid = buyerShortName
          ? playerBids.some((b) => b.bidder_club_id === buyerShortName)
          : false;
        const myClubLeading = buyerShortName && leadingClubShort === buyerShortName;

        const canBid =
          !auctionEnded &&
          canClubBidOnPlayerDraftSync({
            buyerShortName,
            draftAuctionEnabled: draftEnabled,
            draftAuctionStartTime: draftAuctionStartTimeUK,
            windowBids: playerBids,
            draftCredits,
            nowUK,
          });

        const btnClass = auctionEnded
          ? "enabled view-only"
          : canBid
            ? "enabled"
            : "disabled";
        const btnLabel = auctionEnded ? "View" : canBid ? "Bid" : "Locked";
        const isFav = favouriteIds.has(String(player.Konami_ID));
        const isHidden = hiddenIds.has(String(player.Konami_ID));

        draftRowsCache.push({
          player,
          playerName: player.Name || "",
          leadingClubShort,
          leadingClubFull,
          leadingOwner,
          highestAmount,
          myClubBid,
          myClubLeading,
          canBid,
          btnClass,
          btnLabel,
          isFav,
          isHidden,
          auctionEnded,
        });
      }

      advancedFilters.rebuildFromRows(draftRowsCache);
      if (!advancedFiltersRestored) {
        advancedFiltersRestored = true;
        const savedAdv = readPersistedDraftFilters();
        if (savedAdv) {
          advancedFilters.restorePersistState(savedAdv);
          advancedFilters.rebuildFromRows(draftRowsCache);
        }
      }
      renderDraftTable();

      if (!draftRowsCache.length) {
        tbody.innerHTML = `<tr><td colspan="10">No active draft auctions.</td></tr>`;
      }
      } finally {
        listingsLoading = false;
      }
    }
  </script>
