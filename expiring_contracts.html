<script>
  window.CURRENT_PAGE = "expiring_contracts";
</script>
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expiring Contracts</title>
  <link rel="stylesheet" href="dashboard.css">
  <link rel="stylesheet" href="nav_force_horizontal.css?v=20260728-nav-dropdown-fix">
  <link rel="stylesheet" href="gpsl_rules_cards.css?v=20260805-rules">
  <style>
    body { background:#111; color:#ddd; font-family:Arial,sans-serif; margin:0; }
    #nav { padding:15px; background:#1a1a1a; border-bottom:1px solid #333; text-align:center; }
    h1 { margin:20px; color:#ff9900; }
    .panel { margin:20px; padding:20px; background:#1a1a1a; border:1px solid #333; border-radius:8px; }
    .filter-bar {
      display:flex; flex-wrap:wrap; gap:10px 14px; align-items:flex-end;
      margin-bottom:14px; padding-bottom:12px; border-bottom:1px solid #333;
    }
    .filter-bar label {
      display:flex; flex-direction:column; gap:4px; font-size:12px; color:#aaa;
    }
    .filter-bar input, .filter-bar select {
      background:#111; color:#ddd; border:1px solid #444; border-radius:4px;
      padding:6px 8px; min-width:110px; font-size:13px;
    }
    .filter-bar input[type="number"] { width:72px; min-width:72px; }
    .filter-bar .filter-actions { display:flex; gap:8px; align-items:flex-end; padding-bottom:2px; }
    .filter-bar .expiry-multi-filters { display:contents; }
    .filter-bar .multi-filter {
      position:relative;
      min-width:160px;
    }
    .filter-bar .multi-filter-label {
      font-size:12px;
      color:#aaa;
      margin-bottom:4px;
    }
    .filter-bar .multi-filter-control {
      background:#111;
      color:#ddd;
      border:1px solid #444;
      padding:6px 8px;
      border-radius:4px;
      font-size:13px;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:space-between;
      min-height:28px;
      min-width:150px;
    }
    .filter-bar .multi-filter-control::after {
      content:"▾";
      font-size:10px;
      color:#888;
      margin-left:6px;
    }
    .filter-bar .multi-filter-panel {
      position:absolute;
      top:100%;
      left:0;
      z-index:40;
      background:#111;
      border:1px solid #444;
      border-radius:4px;
      margin-top:2px;
      max-height:280px;
      min-width:220px;
      width:max-content;
      max-width:320px;
      display:none;
      box-shadow:0 8px 24px rgba(0,0,0,0.45);
    }
    .filter-bar .multi-filter.open .multi-filter-panel { display:block; }
    .filter-bar .multi-filter-search {
      display:block;
      width:100%;
      box-sizing:border-box;
      background:#1a1a1a;
      color:#ddd;
      border:none;
      border-bottom:1px solid #333;
      padding:8px 10px;
      font-size:12px;
      border-radius:4px 4px 0 0;
      min-width:0;
    }
    .filter-bar .multi-filter-options {
      max-height:220px;
      overflow:auto;
      padding:4px 0;
    }
    .filter-bar .multi-filter-empty {
      padding:10px 12px;
      color:#888;
      font-size:12px;
      font-style:italic;
    }
    .filter-bar .multi-filter-option {
      display:flex;
      align-items:center;
      gap:8px;
      padding:5px 10px;
      font-size:12px;
      color:#ddd;
      cursor:pointer;
    }
    .filter-bar .multi-filter-option:hover { background:#222; }
    .filter-bar .multi-filter-option input { margin:0; min-width:0; }
    .range-filter {
      display:flex; flex-direction:column; gap:4px;
      min-width:168px; max-width:220px; font-size:12px; color:#ffaa22;
    }
    .range-filter-label { font-weight:bold; line-height:1.3; }
    .range-filter-range {
      font-weight:normal; color:#ddd; font-size:11px;
      font-variant-numeric:tabular-nums; white-space:nowrap;
    }
    .range-filter-sliders { position:relative; height:26px; margin-top:2px; }
    .range-filter-track {
      position:absolute; left:0; right:0; top:50%; height:6px;
      transform:translateY(-50%); border-radius:999px; pointer-events:none;
      background:
        linear-gradient(
          to right,
          #444 0%,
          #444 var(--range-min, 0%),
          #ff9900 var(--range-min, 0%),
          #ff9900 var(--range-max, 100%),
          #444 var(--range-max, 100%),
          #444 100%
        );
    }
    .range-filter-sliders input[type="range"] {
      position:absolute; left:0; top:0; width:100%; height:26px; margin:0;
      background:transparent; appearance:none; -webkit-appearance:none;
      pointer-events:none; z-index:3; border:none; padding:0; min-width:0;
    }
    .range-filter-sliders input[type="range"]::-webkit-slider-runnable-track {
      height:6px; background:transparent;
    }
    .range-filter-sliders input[type="range"]::-moz-range-track {
      height:6px; background:transparent;
    }
    .range-filter-sliders input[type="range"].range-filter-min { z-index:3; }
    .range-filter-sliders input[type="range"].range-filter-max { z-index:4; }
    .range-filter-sliders input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance:none; appearance:none;
      width:14px; height:14px; border-radius:50%;
      background:#ff9900; border:2px solid #111; box-shadow:0 0 0 1px #aa6a00;
      margin-top:-4px; cursor:pointer; pointer-events:auto;
    }
    .range-filter-sliders input[type="range"]::-moz-range-thumb {
      width:14px; height:14px; border-radius:50%;
      background:#ff9900; border:2px solid #111; box-shadow:0 0 0 1px #aa6a00;
      cursor:pointer; pointer-events:auto;
    }
    .range-filter-sliders input[type="range"]:disabled { opacity:0.45; }
    table.gpsl-table { width:100%; border-collapse:collapse; }
    table.gpsl-table th, table.gpsl-table td {
      border:1px solid #333; padding:8px; font-size:13px; text-align:center;
    }
    table.gpsl-table th { background:#222; color:#ff9900; }
    table.gpsl-table td.name-cell { text-align:left; }
    .bid-btn { padding:4px 10px; font-size:12px; background:#2f5a2f; color:#fff; border:none; border-radius:4px; cursor:pointer; }
    .bid-btn:hover { background:#3a7a3a; }
    .my-bid { color:#9cf; font-size:12px; }
    .money { color:#9c9; }
    #bidModal {
      display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7);
      align-items:center; justify-content:center; z-index:100;
    }
    #bidModal .modal-inner {
      background:#1a1a1a; border:1px solid #444; padding:20px; border-radius:8px; width:320px;
    }
    #bidModal input { width:100%; padding:8px; margin:10px 0; background:#111; color:#ddd; border:1px solid #444; }
  </style>
</head>
<body>
  <div id="nav"></div>
  <h1>Expiring Contracts</h1>

  <div class="info-box" id="expiringRules" aria-label="Expiring contract rules">
    <!-- Filled by expiring_contracts_rules.js -->
  </div>

  <div class="panel">
    <div class="filter-bar" id="filterBar">
      <label>Name
        <input type="text" id="fName" placeholder="Search name" autocomplete="off">
      </label>
      <div id="expiryMultiFilters" class="expiry-multi-filters">
        <div class="multi-filter" data-col="Position">
          <div class="multi-filter-label">Position</div>
          <div class="multi-filter-control" tabindex="0">All</div>
          <div class="multi-filter-panel">
            <input type="search" class="multi-filter-search" placeholder="Type to find…" autocomplete="off">
            <div class="multi-filter-options"></div>
          </div>
        </div>
        <div class="multi-filter" data-col="Nation">
          <div class="multi-filter-label">Nation</div>
          <div class="multi-filter-control" tabindex="0">All</div>
          <div class="multi-filter-panel">
            <input type="search" class="multi-filter-search" placeholder="Type to find…" autocomplete="off">
            <div class="multi-filter-options"></div>
          </div>
        </div>
        <div class="multi-filter" data-col="Playstyle">
          <div class="multi-filter-label">Playstyle</div>
          <div class="multi-filter-control" tabindex="0">All</div>
          <div class="multi-filter-panel">
            <input type="search" class="multi-filter-search" placeholder="Type to find…" autocomplete="off">
            <div class="multi-filter-options"></div>
          </div>
        </div>
      </div>
      <label>Club
        <select id="fClub"><option value="">All</option></select>
      </label>
      <div class="range-filter" data-col="Rating">
        <div class="range-filter-label">Rating <span class="range-filter-range" id="filter-Rating-range">(—)</span></div>
        <div class="range-filter-sliders" id="filter-Rating-sliders">
          <div class="range-filter-track"></div>
          <input type="range" class="range-filter-min" id="filter-Rating-min" min="40" max="99" value="40" step="1" aria-label="Rating minimum">
          <input type="range" class="range-filter-max" id="filter-Rating-max" min="40" max="99" value="99" step="1" aria-label="Rating maximum">
        </div>
      </div>
      <div class="range-filter" data-col="Age">
        <div class="range-filter-label">Age <span class="range-filter-range" id="filter-Age-range">(—)</span></div>
        <div class="range-filter-sliders" id="filter-Age-sliders">
          <div class="range-filter-track"></div>
          <input type="range" class="range-filter-min" id="filter-Age-min" min="15" max="45" value="15" step="1" aria-label="Age minimum">
          <input type="range" class="range-filter-max" id="filter-Age-max" min="15" max="45" value="45" step="1" aria-label="Age maximum">
        </div>
      </div>
      <label>My bids
        <select id="fMyBid">
          <option value="">All</option>
          <option value="yes">I have a bid</option>
          <option value="no">No bid yet</option>
        </select>
      </label>
      <div class="filter-actions">
        <button type="button" id="fMyClubBtn" class="button secondary" hidden>My Club</button>
        <button type="button" id="fClearBtn" class="button" style="background:#555;">Clear filters</button>
      </div>
    </div>
    <div id="marketStatus" style="color:#aaa;margin-bottom:12px;">Loading…</div>
    <div style="overflow:auto;">
      <table class="gpsl-table">
        <thead>
          <tr>
            <th>Player</th>
            <th>Pos</th>
            <th>Nation</th>
            <th>Age</th>
            <th>Rating</th>
            <th>Playstyle</th>
            <th>MV</th>
            <th>Holding club</th>
            <th>Current wage</th>
            <th>Your bid</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="marketBody"></tbody>
      </table>
    </div>
  </div>

  <div id="bidModal">
    <div class="modal-inner">
      <h3 id="bidModalTitle" style="color:#ff9900;margin-top:0;">Wage bid</h3>
      <p id="bidModalHint" style="font-size:12px;color:#aaa;"></p>
      <label>Wage offer (₿)</label>
      <input type="text" id="bidWageInput" inputmode="numeric">
      <p id="bidModalError" style="color:#f66;font-size:12px;"></p>
      <button type="button" id="bidSubmitBtn" class="button">Submit bid</button>
      <button type="button" id="bidCancelBtn" class="button" style="background:#444;margin-left:8px;">Cancel</button>
    </div>
  </div>

  <script type="module" src="expiring_contracts.js?v=20260805-multi-filters"></script>
</body>
</html>
