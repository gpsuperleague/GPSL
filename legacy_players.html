<script>
  window.CURRENT_PAGE = "legacy_players";
</script>
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Legacy players — GPSL</title>
  <link rel="stylesheet" href="dashboard.css">
  <link rel="stylesheet" href="nav_force_horizontal.css?v=20260728-nav-dropdown-fix">
  <link rel="stylesheet" href="gpsl_rules_cards.css?v=20260805-rules">
  <style>
    body { background:#111; color:#ddd; font-family:Arial,sans-serif; margin:0; }
    #nav { padding:15px; background:#1a1a1a; border-bottom:1px solid #333; text-align:center; }
    h1 { margin:20px 20px 8px; color:#ff9900; font-size:26px; }
    .subtitle { margin:0 20px 16px; color:#999; font-size:14px; max-width:920px; line-height:1.5; }
    .info-box.info-box--accent { margin:0 20px 16px; max-width:920px; font-size:14px; line-height:1.6; }
    .panel { margin:20px; padding:20px; background:#1a1a1a; border:1px solid #333; border-radius:8px; }
    table.gpsl-table { width:100%; border-collapse:collapse; }
    table.gpsl-table th, table.gpsl-table td {
      border:1px solid #333; padding:8px 10px; font-size:13px; text-align:left;
    }
    table.gpsl-table th { background:#222; color:#ff9900; text-align:center; }
    table.gpsl-table td.num { text-align:center; }
    .tag-legacy { color:#fc8; font-size:12px; }
    .empty-note { color:#888; padding:16px; text-align:center; }
    .legacy-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 12px;
      margin-bottom: 14px;
    }
    .legacy-toolbar label {
      color: #888;
      font-size: 12px;
      margin: 0;
    }
    #legacyPlayerSearch {
      min-width: min(100%, 280px);
      flex: 1 1 220px;
      max-width: 360px;
      padding: 8px 10px;
      background: #111;
      color: #eee;
      border: 1px solid #444;
      border-radius: 4px;
      font-size: 13px;
    }
    #legacyPlayerSearch::placeholder { color: #666; }
    #legacyPlayerSearch:focus {
      outline: none;
      border-color: #ff9900;
    }
    #legacyClubFilter {
      min-width: 180px;
      max-width: 280px;
      padding: 8px 10px;
      background: #111;
      color: #eee;
      border: 1px solid #444;
      border-radius: 4px;
      font-size: 13px;
    }
    #legacyClubFilter:focus {
      outline: none;
      border-color: #ff9900;
    }
  </style>
</head>
<body>
  <div id="nav"></div>
  <h1>Legacy players</h1>
  <p class="subtitle">
    Cards removed from <a href="https://pesdb.net/efootball/" target="_blank" rel="noopener" style="color:#ff9900;">pesdb.net</a>
    but still owned in GPSL.
  </p>

  <div class="info-box info-box--accent" id="legacyPlayersRules" aria-label="Legacy player rules">
    <!-- Filled by legacy_players_rules.js -->
  </div>

  <div class="panel">
    <div class="legacy-toolbar">
      <label for="legacyClubFilter">Club</label>
      <select id="legacyClubFilter" title="Filter by club">
        <option value="">All clubs</option>
      </select>
      <label for="legacyPlayerSearch">Search</label>
      <input
        type="text"
        id="legacyPlayerSearch"
        placeholder="Search name, club, or Konami ID (ignores accents)…"
        autocomplete="off"
      >
    </div>
    <div id="listStatus" style="color:#aaa;margin-bottom:12px;">Loading…</div>
    <table class="gpsl-table">
      <thead>
        <tr>
          <th></th>
          <th>Player</th>
          <th>Pos</th>
          <th>OVR</th>
          <th>Club</th>
          <th>Contract</th>
          <th>Legacy since</th>
        </tr>
      </thead>
      <tbody id="legacyBody"></tbody>
    </table>
  </div>

  <script type="module" src="legacy_players.js?v=20260821-club-filter"></script>
</body>
</html>
