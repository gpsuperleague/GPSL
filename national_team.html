<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>National Team — GPSL</title>
  <link rel="stylesheet" href="dashboard.css">
  <link rel="stylesheet" href="nav_force_horizontal.css?v=20260728-nav-dropdown-fix">
  <link rel="stylesheet" href="squad.css">
  <link rel="stylesheet" href="international.css?v=20260728-nat-sections">
  <style>
    body.squad-page { padding-bottom: 40px; }
    .nat-hero {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 0 20px 16px;
      flex-wrap: wrap;
    }
    .nat-meta { color: #aaa; font-size: 14px; margin-top: 4px; }
    .nat-compliance-wrap {
      margin: 0 20px 16px;
      max-width: 520px;
    }
    .nat-toolbar {
      margin: 0 20px 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .nat-toolbar a.button {
      display: inline-block;
      padding: 10px 16px;
      background: #ff9900;
      color: #111;
      text-decoration: none;
      font-weight: bold;
      border-radius: 6px;
      font-size: 13px;
    }
    .nat-toolbar a.button:hover { background: #ffaa22; }
    #squadWrap { margin: 0 20px; }
    .squad-release-btn {
      padding: 4px 10px;
      font-size: 11px;
      background: #552222;
      color: #fff;
      border: 1px solid #773;
      border-radius: 4px;
      cursor: pointer;
    }
    .squad-release-btn:hover { background: #773333; }
    .empty-squad {
      color: #888;
      padding: 24px;
      text-align: center;
    }
  </style>
</head>
<body class="squad-page">
  <div id="nav"></div>

  <div id="headerContainer" class="squad-header">
    <span id="natFlag" class="nat-flag-wrap"></span>
    <div class="squad-header-titles">
      <h1 id="natTitle">National Team</h1>
      <div id="natMeta" class="nat-meta"></div>
    </div>
  </div>

  <div id="squadCompliancePanel" class="nat-compliance-wrap"></div>

  <div class="nat-toolbar">
    <a class="button" href="GPDB.html" id="gpdbCallUpLink">Call up in GPDB</a>
    <a class="button" href="world_cup.html">World Cup</a>
    <a class="button" href="international_matchday.html">Intl matchday</a>
    <a class="button" href="nation_select.html">Nation selection</a>
  </div>

  <div id="squadWrap" class="panel">
    <p class="note" style="margin:0 0 10px;color:#aaa;font-size:13px;">
      Each position group has its own column headers and scrollbar. Player image stays pinned on the left while you scroll.
    </p>
    <div id="natSquadSections" class="nat-squad-sections"></div>
    <p id="emptySquad" class="empty-squad" hidden>No players called up yet. Use GPDB → My nation filter → Call up.</p>
  </div>

  <script type="module" src="national_team.js?v=20260728-nat-sections"></script>

</html>
