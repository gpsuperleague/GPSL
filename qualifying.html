<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>html,body{background:#111;color:#ddd;margin:0}</style>
  <title>Qualifying — GPSL</title>
  <link rel="stylesheet" href="dashboard.css">
  <link rel="stylesheet" href="nav_force_horizontal.css?v=20260728-nav-dropdown-fix">
  <style>
    main { max-width: 1180px; margin: 0 auto; padding: 24px 16px 64px; box-sizing: border-box; }
    h1 { color: #ffcc66; font-size: 28px; margin: 0 0 8px; }
    .lead { color: #aaa; line-height: 1.5; margin: 0 0 20px; }
    .qual-steps {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      border: 1px solid #3a3a3a;
      border-radius: 10px;
      overflow: hidden;
      background: #3a3a3a;
      gap: 1px;
    }
    .step {
      margin: 0;
      border: 0;
      border-radius: 0;
      padding: 16px 16px 18px;
      background: #161616;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 100%;
      box-sizing: border-box;
    }
    .step.current { box-shadow: inset 0 3px 0 #ff9900; }
    .step.locked { background: #141414; }
    .step.locked .step-body { opacity: 0.72; }
    .step-head {
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      min-height: 32px;
      margin: 0 0 12px;
    }
    .step-no {
      width: 28px;
      height: 28px;
      border: 1px solid #ff9900;
      border-radius: 50%;
      color: #ffcc66;
      display: grid;
      place-items: center;
      font-size: 13px;
      font-weight: 700;
    }
    .step.done .step-no { background: #ff9900; color: #111; }
    .step.locked .step-no { border-color: #555; color: #888; }
    .step h2 { margin: 0; font-size: 15px; line-height: 1.25; color: #ffcc66; }
    .step-body { flex: 1 1 auto; }
    .step-actions { margin-top: auto; padding-top: 14px; }
    .step p, .step li { color: #ccc; font-size: 13px; line-height: 1.45; margin: 0 0 8px; }
    .step .pill {
      font-size: 11px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #888;
      white-space: nowrap;
    }
    .step.done .pill { color: #8d8; }
    .step.current .pill { color: #ffcc66; }
    label { display: grid; gap: 4px; font-size: 13px; color: #bbb; margin: 0 0 8px; }
    input[type="text"], input[type="date"] {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      background: #1a1a1a;
      border: 1px solid #333;
      color: #eee;
      border-radius: 4px;
    }
    .step .row { display: flex; flex-direction: column; align-items: stretch; }
    .step button.button { width: 100%; box-sizing: border-box; margin: 0; }
    .friendly-tally {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 0 0 8px;
    }
    .friendly-tally div {
      border: 1px solid #3a3a3a;
      border-radius: 8px;
      background: #121212;
      text-align: center;
      padding: 8px 6px 7px;
    }
    .friendly-tally b {
      display: block;
      font-size: 28px;
      line-height: 1;
      color: #ffcc66;
    }
    .friendly-tally span {
      display: block;
      margin-top: 4px;
      font-size: 10px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #888;
    }
    .friendly-pips { display: flex; gap: 4px; margin: 0 0 10px; }
    .friendly-pips i {
      flex: 1;
      height: 6px;
      border-radius: 99px;
      background: #2a2a2a;
    }
    .friendly-pips i.on { background: #ff9900; }
    .friendly-sub {
      margin: 8px 0 4px;
      font-size: 11px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #888;
    }
    .friendly-list { list-style: none; padding: 0; margin: 0 0 8px; }
    .friendly-list li { padding: 6px 0; border-top: 1px solid #2a2a2a; }
    .friendly-list li.empty { color: #777; }
    .friendly-list .score {
      display: block;
      color: #ffcc66;
      font-family: ui-monospace, monospace;
      font-size: 13px;
    }
    .code { font-family: ui-monospace, monospace; color: #ffcc66; font-size: 15px; }
    .qual-avail {
      margin-top: 12px;
      border: 1px solid #3a3a3a;
      border-radius: 10px;
      padding: 16px;
      background: #161616;
      box-sizing: border-box;
    }
    .qual-avail h2 { margin: 0 0 4px; font-size: 15px; color: #ffcc66; }
    .qual-avail > p { color: #ccc; font-size: 13px; line-height: 1.45; margin: 0 0 8px; }
    #status { margin-top: 12px; white-space: pre-wrap; }
    button.button.secondary { background: #444; color: #ddd; }
    @media (max-width: 980px) {
      .qual-steps { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="nav"></div>
  <main>
    <h1>Become an owner</h1>
    <p class="lead" id="lead">Each step unlocks the next. A club stays closed until the video is approved and an admin opens a door.</p>
    <div id="steps"></div>
    <div id="status"></div>
  </main>
  <script type="module" src="qualifying.js?v=20261117-qualifying-count"></script>
</body>
</html>
