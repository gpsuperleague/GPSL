<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>html,body{background:#111;color:#ddd;margin:0}</style>
  <title>Qualifying — GPSL</title>
  <link rel="stylesheet" href="dashboard.css">
  <link rel="stylesheet" href="nav_force_horizontal.css?v=20260728-nav-dropdown-fix">
  <style>
    main { max-width: 1280px; margin: 0 auto; padding: 24px 16px 64px; box-sizing: border-box; }
    h1 { color: #ffcc66; font-size: 28px; margin: 0 0 8px; }
    .lead { color: #aaa; line-height: 1.5; margin: 0 0 20px; }
    .qual-steps {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      border: 1px solid #3a3a3a;
      border-radius: 10px;
      overflow: hidden;
      background: #3a3a3a;
      gap: 1px;
    }
    .step {
      margin: 0;
      border: 0;
      border-radius: 0;
      padding: 16px 16px 18px;
      background: #161616;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 100%;
      box-sizing: border-box;
    }
    .step.current { box-shadow: inset 0 3px 0 #ff9900; }
    .step.locked { background: #141414; }
    .step.locked .step-body { opacity: 0.72; }
    .step-head {
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      min-height: 32px;
      margin: 0 0 12px;
    }
    .step-no {
      width: 28px;
      height: 28px;
      border: 1px solid #ff9900;
      border-radius: 50%;
      color: #ffcc66;
      display: grid;
      place-items: center;
      font-size: 13px;
      font-weight: 700;
    }
    .step.done .step-no { background: #ff9900; color: #111; }
    .step.locked .step-no { border-color: #555; color: #888; }
    .step h2 { margin: 0; font-size: 15px; line-height: 1.25; color: #ffcc66; }
    .step-body { flex: 1 1 auto; }
    .step-actions { margin-top: auto; padding-top: 14px; }
    .step p, .step li { color: #ccc; font-size: 13px; line-height: 1.45; margin: 0 0 8px; }
    .step .pill {
      font-size: 11px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #888;
      white-space: nowrap;
    }
    .step.done .pill { color: #8d8; }
    .step.current .pill { color: #ffcc66; }
    label { display: grid; gap: 4px; font-size: 13px; color: #bbb; margin: 0 0 8px; }
    input[type="text"], input[type="date"] {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      background: #1a1a1a;
      border: 1px solid #333;
      color: #eee;
      border-radius: 4px;
    }
    .step .row { display: flex; flex-direction: column; align-items: stretch; }
    .step button.button { width: 100%; box-sizing: border-box; margin: 0; }
    .friendly-tally {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 0 0 8px;
    }
    .friendly-tally div {
      border: 1px solid #3a3a3a;
      border-radius: 8px;
      background: #121212;
      text-align: center;
      padding: 8px 6px 7px;
    }
    .friendly-tally b {
      display: block;
      font-size: 28px;
      line-height: 1;
      color: #ffcc66;
    }
    .friendly-tally span {
      display: block;
      margin-top: 4px;
      font-size: 10px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #888;
    }
    .friendly-pips { display: flex; gap: 4px; margin: 0 0 10px; align-items: flex-start; }
    .friendly-pips .pip { flex: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
    .friendly-pips i {
      display: block;
      height: 8px;
      border-radius: 99px;
      background: #2a2a2a;
    }
    .friendly-pips i.on {
      background: linear-gradient(90deg, var(--from, #ff9900), var(--to, #3ecf6e));
    }
    .friendly-pips .film i { box-shadow: 0 0 0 1px #ff9900; }
    .friendly-pips em {
      font-style: normal;
      font-size: 9px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #ffcc66;
      text-align: center;
    }
    .record-target {
      border: 1px solid #3a3a3a;
      border-left: 3px solid #ff9900;
      border-radius: 8px;
      padding: 8px 10px;
      margin: 0 0 8px;
      background: #121212;
    }
    .record-target span {
      display: block;
      font-size: 10px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #888;
    }
    .record-target b { display: block; margin-top: 2px; color: #ffcc66; font-size: 13px; }
    .match-slots { margin-top: 8px; }
    .match-slot { padding: 8px 0; }
    .slot-label {
      display: block;
      font-size: 11px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 2px;
    }
    .film-slot .slot-label { color: #ffcc66; }
    .slot-empty { color: #777; }
    .record-flag {
      margin-left: 8px;
      font-size: 10px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #8d8;
    }
    .wl-place {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin: 0 0 8px;
    }
    .wl-place b { font-size: 28px; line-height: 1; color: #ffcc66; }
    .wl-place span { color: #aaa; font-size: 12px; }
    .wl-queue {
      list-style: none;
      margin: 0;
      padding: 0;
      max-height: 240px;
      overflow: auto;
      border: 1px solid #3a3a3a;
      border-radius: 8px;
      background: #121212;
    }
    .wl-queue li {
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr) auto;
      gap: 6px;
      align-items: center;
      padding: 6px 8px;
      border-top: 1px solid #2a2a2a;
      font-size: 12px;
      color: #ddd;
    }
    .wl-queue li:first-child { border-top: 0; }
    .wl-queue li span { color: #888; }
    .wl-queue li.you {
      background: #241c10;
      box-shadow: inset 3px 0 0 #ff9900;
      color: #ffcc66;
    }
    .wl-queue em {
      font-style: normal;
      font-size: 10px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #8d8;
    }
    .qual-guides {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      margin: 0 0 12px;
      border: 1px solid #3a3a3a;
      border-radius: 10px;
      overflow: hidden;
      background: #3a3a3a;
    }
    .qual-guides a {
      display: block;
      background: #161616;
      color: #ffcc66;
      text-decoration: none;
      padding: 12px 16px;
      font-size: 14px;
    }
    .qual-guides a:hover { background: #1c1c1c; }
    .req { list-style: disc; margin: 0 0 8px; padding-left: 16px; }
    .req li { margin: 0 0 6px; }
    .avail-summary { list-style: none; padding: 0; margin: 0 0 8px; }
    .avail-summary li { padding: 4px 0; border-top: 1px solid #2a2a2a; color: #ddd; }
    .friendly-sub {
      margin: 8px 0 4px;
      font-size: 11px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #888;
    }
    .friendly-list { list-style: none; padding: 0; margin: 0 0 8px; }
    .friendly-list li { padding: 6px 0; border-top: 1px solid #2a2a2a; }
    .friendly-list li.empty { color: #777; }
    .friendly-list .score {
      display: block;
      color: #ffcc66;
      font-family: ui-monospace, monospace;
      font-size: 13px;
    }
    .code { font-family: ui-monospace, monospace; color: #ffcc66; font-size: 15px; }
    .recording-code {
      font-family: ui-monospace, monospace;
      color: #ffcc66;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.04em;
      margin: 4px 0 10px;
    }
    .qual-avail {
      margin-top: 12px;
      border: 1px solid #3a3a3a;
      border-radius: 10px;
      padding: 16px;
      background: #161616;
      box-sizing: border-box;
    }
    .qual-avail h2 { margin: 0 0 4px; font-size: 15px; color: #ffcc66; }
    .qual-avail > p { color: #ccc; font-size: 13px; line-height: 1.45; margin: 0 0 8px; }
    #status { margin-top: 12px; white-space: pre-wrap; }
    button.button.secondary { background: #444; color: #ddd; }
    @media (max-width: 1100px) {
      .qual-steps { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="nav"></div>
  <main>
    <h1>Become an owner</h1>
    <p class="lead" id="lead">Five steps. Each one unlocks the next. A club stays closed until the video is approved and an admin opens a door.</p>
    <nav class="qual-guides" aria-label="Guides">
      <a href="getting_started.html">Beginner's guide</a>
      <a href="learning_gpsl.html">GPSL handbook</a>
    </nav>
    <div id="steps"></div>
    <div id="status"></div>
  </main>
  <script type="module" src="qualifying.js?v=20261118-clearly-shown"></script>
</body>
</html>
